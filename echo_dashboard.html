<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Show Smart Dashboard</title>

    <script>
        /* ==========================================================================
           EASY CUSTOMIZATION SETTINGS (EDIT HERE!)
           ==========================================================================
           Change your city/location, coordinates, timezone, and calendar rules below.
           You do NOT need to touch any other code in this file!
           ========================================================================== */
        const USER_SETTINGS = {
            // 1. WEATHER & CALENDAR LOCATION
            // Tip: Find your exact Latitude & Longitude on Google Maps (right-click any spot).
            LOCATION_NAME: 'Teaneck, NJ',
            LATITUDE: 40.8976,
            LONGITUDE: -74.0154,

            // 2. TIMEZONE (Used for Clock & Hebcal Shabbat/Holiday Times)
            // Examples: 'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Asia/Jerusalem', 'Europe/London'
            TIMEZONE: 'America/New_York',

            // 3. TEMPERATURE & CLOCK FORMAT
            TEMP_UNIT: 'fahrenheit',          // 'fahrenheit' or 'celsius'
            USE_24_HOUR: false,               // false = 12-hour (AM/PM), true = 24-hour

            // 4. HEBCAL SHABBAT & HOLIDAY CALENDAR SETTINGS
            HEBCAL_ENABLED: true,             // true to show Hebcal events, false to hide
            CANDLE_LIGHTING_MINS: 18,         // Minutes before sunset (e.g., 18, 20, 30, 40)
            HAVDALAH_MINS: 50,                // Minutes after sunset for Havdalah (e.g., 42, 50, 72)
            ISRAEL_SCHEDULE: false,           // true if located in Israel (1-day Yom Tov & Israeli Parsha), false for Diaspora
            MAX_CALENDAR_ITEMS: 4,            // Maximum number of event cards to show in top-left

            // 5. AUTO NIGHT DIMMING MODE (24-hour format: 0 to 23)
            NIGHT_MODE_ENABLED: true,
            NIGHT_START_HOUR: 22,             // 22 = 10:00 PM
            NIGHT_END_HOUR: 6                 // 6 = 6:00 AM
        };
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tone.js for Local Kitchen Timer Chimes & Ambient Soundscapes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');

        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #090d16;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .text-shadow-heavy {
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.75), 0 0 36px rgba(0, 0, 0, 0.55);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
        }

        .glass-pill {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1.4s ease-in-out;
            will-change: opacity;
        }

        #dashboard-root {
            transition: transform 2.5s ease-in-out;
            will-change: transform;
        }

        #night-overlay {
            background: radial-gradient(circle at center, rgba(15, 8, 0, 0.55) 0%, rgba(0, 0, 0, 0.85) 100%);
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        #control-dock {
            opacity: 0.85;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #control-dock:hover,
        #control-dock:focus-within {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden">

    <!-- Dual Background Layers for Zero-Flicker Cross-Fades -->
    <div id="bg-layer-1" class="bg-layer z-0 opacity-100"></div>
    <div id="bg-layer-2" class="bg-layer z-0 opacity-0"></div>

    <!-- Ambient Contrast & Auto Night Mode Overlays -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/45 via-black/15 to-black/75 z-10 pointer-events-none"></div>
    <div id="night-overlay" class="absolute inset-0 z-30 opacity-0"></div>

    <!-- Full-Screen Blackout Sleep Overlay -->
    <div id="blackout-overlay" class="hidden fixed inset-0 bg-black z-50 cursor-pointer flex items-center justify-center">
        <span class="text-white/20 text-xs uppercase tracking-widest select-none">Tap anywhere to wake</span>
    </div>

    <!-- Bottom-Center Touch Control Dock -->
    <div id="control-dock" class="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-40 w-max max-w-[95vw]">
        <div class="glass-panel rounded-2xl p-2 sm:p-2.5 flex flex-wrap justify-center items-center gap-1.5 shadow-2xl text-xs sm:text-sm font-medium">
            <span class="text-[11px] font-bold uppercase tracking-wider text-white/60 px-1.5 hidden sm:inline">Timers</span>
            <button type="button" data-timer="5" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">⏱️ 5m</button>
            <button type="button" data-timer="10" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">10m</button>
            <button type="button" data-timer="15" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">15m</button>
            <button type="button" data-timer="30" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">30m</button>
            <button type="button" id="btn-cancel-timer" class="hidden px-2.5 py-1.5 rounded-xl bg-red-500/40 hover:bg-red-500/60 text-red-100 active:scale-95 transition">✕ Stop</button>

            <div class="h-4 w-px bg-white/20 mx-0.5"></div>

            <button type="button" id="btn-ambient-sound" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Ambient Soundscape">🎧 Off</button>
            <button type="button" id="btn-cycle-bg" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Cycle Wallpaper">🖼️ BG</button>
            <button type="button" id="btn-toggle-night" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Toggle Night Dimming">🌙 Night</button>
            <button type="button" id="btn-blackout" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Turn Screen Black">⬛ Off</button>
            <button type="button" id="btn-refresh" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Refresh Data"><span id="refresh-icon" class="inline-block transition-transform duration-500">🔄</span></button>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <main id="dashboard-root" class="relative z-20 h-full w-full p-5 sm:p-8 md:p-10">

        <!-- Top Header: Hebcal Schedule (Left) & Offline Badge (Right) -->
        <header class="relative z-30 flex justify-between items-start w-full pointer-events-none">
            <section id="hebcal-card" aria-live="polite" aria-label="Jewish calendar and Shabbat times" class="max-w-xs sm:max-w-sm pointer-events-auto">
                <div id="hebcal-events-list" class="flex flex-col gap-2 text-xs sm:text-sm text-white/95">
                    <div class="glass-panel rounded-xl px-3.5 py-2.5 text-white/60">Loading schedule...</div>
                </div>
            </section>

            <div id="network-offline-pill" class="hidden pointer-events-auto inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-500/30 border border-red-400/50 text-red-100 text-xs font-semibold animate-pulse">
                <span class="w-2 h-2 rounded-full bg-red-400"></span>
                <span>Offline</span>
            </div>
        </header>

        <!-- Centered Hero: Date, Clock & Weather -->
        <section class="fixed inset-0 z-20 flex flex-col items-center justify-center text-center text-shadow-heavy px-4 pointer-events-none">
            <div class="flex flex-col items-center justify-center w-full max-w-4xl gap-4 sm:gap-5">

                <!-- Stacked Date & Digital Clock -->
                <div class="flex items-center justify-center gap-3.5 sm:gap-5 md:gap-6">
                    <div aria-live="polite" class="flex flex-col items-center justify-center leading-none border-r border-white/25 pr-3.5 sm:pr-5 py-1">
                        <span id="date-month" class="text-xl sm:text-2xl md:text-3xl font-bold uppercase tracking-widest text-amber-200/95">---</span>
                        <span id="date-day" class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight tabular-nums mt-0.5">--</span>
                    </div>

                    <div aria-live="off" class="flex items-baseline gap-1.5 sm:gap-2.5">
                        <div id="time" class="text-7xl sm:text-8xl md:text-9xl lg:text-[10rem] font-black leading-none tracking-tight tabular-nums">--:--</div>
                        <div id="ampm" class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold opacity-90"></div>
                    </div>
                </div>

                <!-- Unified Weather Pill & Environmental Metric Pills -->
                <div aria-live="polite" aria-label="Current weather and environmental conditions" class="flex flex-col items-center gap-3.5 sm:gap-4 w-full">
                    <div class="glass-pill inline-flex items-center justify-center gap-2.5 sm:gap-3 px-4 py-1.5 sm:px-5 sm:py-2 rounded-full">
                        <span id="weather-icon" class="text-2xl sm:text-3xl md:text-4xl" aria-hidden="true">🌡️</span>
                        <span id="weather-temp" class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight tabular-nums">--°</span>
                        <span class="h-5 sm:h-6 w-px bg-white/25 mx-0.5" aria-hidden="true"></span>
                        <span id="weather-desc" class="text-base sm:text-xl md:text-2xl font-medium text-white/95">Loading weather...</span>
                    </div>

                    <div class="flex flex-wrap justify-center gap-1.5 sm:gap-2 max-w-2xl">
                        <span id="pill-feels" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-white/90 tabular-nums">Feels --°</span>
                        <span id="pill-rain" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-sky-200 tabular-nums">💧 --%</span>
                        <span id="pill-uv" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-amber-200 tabular-nums">☀️ UV --</span>
                        <span id="pill-aqi" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-emerald-200 tabular-nums">🍃 AQI --</span>
                        <span id="pill-sun" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-orange-200 tabular-nums">🌅 --:--</span>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <script>
        /* ==========================================================================
           INTERNAL CONFIGURATION (MAPPED FROM USER_SETTINGS ABOVE)
           ========================================================================== */
        const CONFIG = {
            LOCATION: {
                NAME: USER_SETTINGS.LOCATION_NAME,
                LAT: Number(USER_SETTINGS.LATITUDE),
                LON: Number(USER_SETTINGS.LONGITUDE)
            },
            TEMP_UNIT: USER_SETTINGS.TEMP_UNIT,
            LOCALE: 'en-US',
            TIMEZONE: USER_SETTINGS.TIMEZONE || Intl.DateTimeFormat().resolvedOptions().timeZone,
            USE_24_HOUR: USER_SETTINGS.USE_24_HOUR,

            HEBCAL: {
                ENABLED: USER_SETTINGS.HEBCAL_ENABLED,
                CANDLE_LIGHTING_MINS: USER_SETTINGS.CANDLE_LIGHTING_MINS,
                HAVDALAH_MINS: USER_SETTINGS.HAVDALAH_MINS,
                ISRAEL: USER_SETTINGS.ISRAEL_SCHEDULE,
                MAX_ITEMS: USER_SETTINGS.MAX_CALENDAR_ITEMS
            },

            NIGHT_MODE: {
                ENABLED: USER_SETTINGS.NIGHT_MODE_ENABLED,
                START_HOUR: USER_SETTINGS.NIGHT_START_HOUR,
                END_HOUR: USER_SETTINGS.NIGHT_END_HOUR
            },

            PIXEL_SHIFT: {
                ENABLED: true,
                MAX_OFFSET_PX: 4,
                INTERVAL_MS: 15 * 60 * 1000
            },

            CLOCK_INTERVAL_MS: 1000,
            WEATHER_INTERVAL_MS: 10 * 60 * 1000,
            FETCH_TIMEOUT_MS: 8000,
            STORAGE_KEY: 'echo_dashboard_cache_v5',

            SOUND: {
                VOLUME_DB: -18,
                CHIME_VOLUME_DB: -10
            },

            FALLBACK_WALLPAPERS: [
                'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=85',
                'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=85',
                'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=85',
                'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=85'
            ],

            WEATHER_WALLPAPERS: {
                clear: [
                    'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1920&q=85'
                ],
                cloudy: [
                    'https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?auto=format&fit=crop&w=1920&q=85'
                ],
                rain: [
                    'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1534274988757-a28bf1a57c17?auto=format&fit=crop&w=1920&q=85'
                ],
                snow: [
                    'https://images.unsplash.com/photo-1491002052546-bf38f186af56?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=1920&q=85'
                ],
                night: [
                    'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?auto=format&fit=crop&w=1920&q=85'
                ]
            }
        };

        /* ==========================================================================
           DOM ELEMENT CACHE & APPLICATION STATE
           ========================================================================== */
        const DOM = {
            root: document.getElementById('dashboard-root'),
            bg1: document.getElementById('bg-layer-1'),
            bg2: document.getElementById('bg-layer-2'),
            nightOverlay: document.getElementById('night-overlay'),
            blackoutOverlay: document.getElementById('blackout-overlay'),
            networkOfflinePill: document.getElementById('network-offline-pill'),
            hebcalCard: document.getElementById('hebcal-card'),
            hebcalEventsList: document.getElementById('hebcal-events-list'),
            dateMonth: document.getElementById('date-month'),
            dateDay: document.getElementById('date-day'),
            time: document.getElementById('time'),
            ampm: document.getElementById('ampm'),
            weatherIcon: document.getElementById('weather-icon'),
            weatherTemp: document.getElementById('weather-temp'),
            weatherDesc: document.getElementById('weather-desc'),
            pillFeels: document.getElementById('pill-feels'),
            pillRain: document.getElementById('pill-rain'),
            pillUv: document.getElementById('pill-uv'),
            pillAqi: document.getElementById('pill-aqi'),
            pillSun: document.getElementById('pill-sun'),
            btnCancelTimer: document.getElementById('btn-cancel-timer'),
            btnAmbientSound: document.getElementById('btn-ambient-sound'),
            btnCycleBg: document.getElementById('btn-cycle-bg'),
            btnToggleNight: document.getElementById('btn-toggle-night'),
            btnBlackout: document.getElementById('btn-blackout'),
            btnRefresh: document.getElementById('btn-refresh'),
            refreshIcon: document.getElementById('refresh-icon')
        };

        const state = {
            activeBgLayer: 1,
            bgCategory: 'clear',
            bgIndex: 0,
            manualNightOverride: null,
            timerEndTime: null,
            timerInterval: null,
            ambientMode: 'off',
            ambientNodes: null
        };

        const WEATHER_CODES = {
            0: { desc: 'Clear Sky', icon: '☀️', nightIcon: '🌙', category: 'clear' },
            1: { desc: 'Mainly Clear', icon: '🌤️', nightIcon: '🌙', category: 'clear' },
            2: { desc: 'Partly Cloudy', icon: '⛅', nightIcon: '☁️', category: 'cloudy' },
            3: { desc: 'Overcast', icon: '☁️', nightIcon: '☁️', category: 'cloudy' },
            45: { desc: 'Foggy', icon: '🌫️', nightIcon: '🌫️', category: 'cloudy' },
            48: { desc: 'Rime Fog', icon: '🌫️', nightIcon: '🌫️', category: 'cloudy' },
            51: { desc: 'Light Drizzle', icon: '🌦️', nightIcon: '🌧️', category: 'rain' },
            53: { desc: 'Drizzle', icon: '🌦️', nightIcon: '🌧️', category: 'rain' },
            55: { desc: 'Heavy Drizzle', icon: '🌧️', nightIcon: '🌧️', category: 'rain' },
            61: { desc: 'Light Rain', icon: '🌦️', nightIcon: '🌧️', category: 'rain' },
            63: { desc: 'Rain', icon: '🌧️', nightIcon: '🌧️', category: 'rain' },
            65: { desc: 'Heavy Rain', icon: '🌧️', nightIcon: '🌧️', category: 'rain' },
            71: { desc: 'Light Snow', icon: '🌨️', nightIcon: '🌨️', category: 'snow' },
            73: { desc: 'Snow', icon: '❄️', nightIcon: '❄️', category: 'snow' },
            75: { desc: 'Heavy Snow', icon: '❄️', nightIcon: '❄️', category: 'snow' },
            80: { desc: 'Rain Showers', icon: '🌦️', nightIcon: '🌧️', category: 'rain' },
            81: { desc: 'Moderate Showers', icon: '🌧️', nightIcon: '🌧️', category: 'rain' },
            82: { desc: 'Violent Showers', icon: '⛈️', nightIcon: '⛈️', category: 'rain' },
            95: { desc: 'Thunderstorm', icon: '⛈️', nightIcon: '⛈️', category: 'rain' },
            96: { desc: 'Hail Storm', icon: '⛈️', nightIcon: '⛈️', category: 'rain' },
            99: { desc: 'Heavy Hail', icon: '⛈️', nightIcon: '⛈️', category: 'rain' }
        };

        const monthFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, { month: 'short', timeZone: CONFIG.TIMEZONE });
        const dayFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, { day: 'numeric', timeZone: CONFIG.TIMEZONE });

        /* ==========================================================================
           CLOCK & NIGHT MODE
           ========================================================================== */
        const timePartsFormatter = new Intl.DateTimeFormat('en-US', {
            hour: 'numeric',
            minute: '2-digit',
            hour12: !CONFIG.USE_24_HOUR,
            timeZone: CONFIG.TIMEZONE
        });

        const nightHourFormatter = new Intl.DateTimeFormat('en-US', {
            hour: 'numeric',
            hour12: false,
            timeZone: CONFIG.TIMEZONE
        });

        function updateClock() {
            const now = new Date();
            const parts = timePartsFormatter.formatToParts(now);
            const hourPart = parts.find(p => p.type === 'hour')?.value || '--';
            const minPart = parts.find(p => p.type === 'minute')?.value || '--';
            const dayPeriod = parts.find(p => p.type === 'dayPeriod')?.value || '';

            DOM.time.textContent = `${hourPart}:${minPart}`;
            DOM.ampm.textContent = CONFIG.USE_24_HOUR ? '' : dayPeriod.toUpperCase();

            DOM.dateMonth.textContent = monthFormatter.format(now).toUpperCase();
            DOM.dateDay.textContent = dayFormatter.format(now);
            updateNightMode(now);
        }

        function updateNightMode(now = new Date()) {
            if (!CONFIG.NIGHT_MODE.ENABLED && state.manualNightOverride === null) {
                DOM.nightOverlay.style.opacity = '0';
                return;
            }

            let isNight = false;
            if (state.manualNightOverride !== null) {
                isNight = state.manualNightOverride;
            } else {
                const h = parseInt(nightHourFormatter.format(now), 10) % 24;
                const { START_HOUR, END_HOUR } = CONFIG.NIGHT_MODE;
                isNight = START_HOUR > END_HOUR
                    ? (h >= START_HOUR || h < END_HOUR)
                    : (h >= START_HOUR && h < END_HOUR);
            }

            DOM.nightOverlay.style.opacity = isNight ? '1' : '0';
            DOM.btnToggleNight.textContent = isNight ? '☀️ Day' : '🌙 Night';
        }

        /* ==========================================================================
           WALLPAPER CROSS-FADE ENGINE
           ========================================================================== */
        function setWallpaper(category = state.bgCategory, advanceIndex = false) {
            state.bgCategory = category;
            const pool = CONFIG.WEATHER_WALLPAPERS[category] || CONFIG.FALLBACK_WALLPAPERS;

            if (advanceIndex) {
                state.bgIndex = (state.bgIndex + 1) % pool.length;
            } else {
                state.bgIndex = state.bgIndex % pool.length;
            }

            const targetUrl = pool[state.bgIndex];
            const preload = new Image();
            preload.onload = () => applyBackgroundImage(targetUrl);
            preload.onerror = () => {
                const fallbackUrl = CONFIG.FALLBACK_WALLPAPERS[0];
                applyBackgroundImage(fallbackUrl);
            };
            preload.src = targetUrl;
        }

        function applyBackgroundImage(url) {
            const incoming = state.activeBgLayer === 1 ? DOM.bg2 : DOM.bg1;
            const outgoing = state.activeBgLayer === 1 ? DOM.bg1 : DOM.bg2;

            incoming.style.backgroundImage = `url("${url}")`;
            incoming.classList.remove('opacity-0');
            incoming.classList.add('opacity-100');

            outgoing.classList.remove('opacity-100');
            outgoing.classList.add('opacity-0');

            state.activeBgLayer = state.activeBgLayer === 1 ? 2 : 1;
        }

        /* ==========================================================================
           NETWORK HELPER & WEATHER / AIR QUALITY FETCH
           ========================================================================== */
        async function fetchWithTimeout(url, timeoutMs = CONFIG.FETCH_TIMEOUT_MS) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(id);
            }
        }

        async function fetchWeatherAndEnv() {
            const { LAT, LON } = CONFIG.LOCATION;
            const cacheKey = `${CONFIG.STORAGE_KEY}_${LAT}_${LON}_${CONFIG.TEMP_UNIT}_${CONFIG.TIMEZONE}`;
            const tzParam = encodeURIComponent(CONFIG.TIMEZONE || 'auto');

            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,is_day,weather_code&daily=sunrise,sunset,uv_index_max,precipitation_probability_max&temperature_unit=${CONFIG.TEMP_UNIT}&timezone=${tzParam}&forecast_days=1`;
            const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi`;

            try {
                const [weatherData, aqiData] = await Promise.all([
                    fetchWithTimeout(weatherUrl),
                    fetchWithTimeout(aqiUrl).catch(() => null)
                ]);

                const payload = {
                    temp: Math.round(weatherData.current.temperature_2m),
                    feelsLike: Math.round(weatherData.current.apparent_temperature),
                    isDay: weatherData.current.is_day === 1,
                    code: weatherData.current.weather_code,
                    rainChance: weatherData.daily?.precipitation_probability_max?.[0] ?? 0,
                    uvMax: Math.round(weatherData.daily?.uv_index_max?.[0] ?? 0),
                    sunrise: weatherData.daily?.sunrise?.[0] ?? null,
                    sunset: weatherData.daily?.sunset?.[0] ?? null,
                    aqi: aqiData?.current?.us_aqi ?? null
                };

                localStorage.setItem(cacheKey, JSON.stringify(payload));
                renderWeather(payload);
            } catch (err) {
                console.warn('Weather fetch failed, checking cache:', err);
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    renderWeather(JSON.parse(cached));
                } else {
                    DOM.weatherDesc.textContent = 'Weather unavailable';
                }
            }
        }

        function renderWeather(data) {
            const info = WEATHER_CODES[data.code] || { desc: 'Clear', icon: '🌡️', nightIcon: '🌙', category: 'clear' };
            DOM.weatherIcon.textContent = data.isDay ? info.icon : info.nightIcon;
            DOM.weatherTemp.textContent = `${data.temp}°`;
            DOM.weatherDesc.textContent = info.desc;

            DOM.pillFeels.textContent = `Feels ${data.feelsLike}°`;
            DOM.pillRain.textContent = `💧 ${data.rainChance}%`;
            DOM.pillUv.textContent = `☀️ UV ${data.uvMax}`;
            DOM.pillAqi.textContent = data.aqi !== null ? `🍃 AQI ${data.aqi}` : '🍃 AQI --';

            if (data.sunrise && data.sunset) {
                const now = new Date();
                const sunriseTime = new Date(data.sunrise);
                const sunsetTime = new Date(data.sunset);
                const targetTime = (now < sunriseTime) ? sunriseTime : (now < sunsetTime ? sunsetTime : sunriseTime);
                const label = (now >= sunriseTime && now < sunsetTime) ? '🌇' : '🌅';
                const formatted = targetTime.toLocaleTimeString(CONFIG.LOCALE, {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: !CONFIG.USE_24_HOUR
                });
                DOM.pillSun.textContent = `${label} ${formatted}`;
            }

            const bgCategory = data.isDay ? info.category : 'night';
            if (bgCategory !== state.bgCategory) {
                setWallpaper(bgCategory, false);
            }
        }

        /* ==========================================================================
           HEBCAL SHABBAT & HOLIDAY CALENDAR
           ========================================================================== */
        async function fetchHebcalCalendar() {
            if (!CONFIG.HEBCAL.ENABLED) {
                DOM.hebcalCard.classList.add('hidden');
                return;
            }

            const { LAT, LON } = CONFIG.LOCATION;
            const tzid = encodeURIComponent(CONFIG.TIMEZONE || 'America/New_York');
            const israelParam = CONFIG.HEBCAL.ISRAEL ? '&i=on' : '';
            const cacheKey = `${CONFIG.STORAGE_KEY}_hebcal_${LAT}_${LON}_${CONFIG.TIMEZONE}_${CONFIG.HEBCAL.CANDLE_LIGHTING_MINS}_${CONFIG.HEBCAL.HAVDALAH_MINS}_${CONFIG.HEBCAL.ISRAEL}`;
            const url = `https://www.hebcal.com/shabbat?cfg=json&geo=pos&latitude=${LAT}&longitude=${LON}&tzid=${tzid}&M=on&b=${CONFIG.HEBCAL.CANDLE_LIGHTING_MINS}&m=${CONFIG.HEBCAL.HAVDALAH_MINS}${israelParam}`;

            try {
                const data = await fetchWithTimeout(url);
                if (Array.isArray(data?.items)) {
                    const fmtDay = new Intl.DateTimeFormat(CONFIG.LOCALE, {
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric',
                        timeZone: CONFIG.TIMEZONE
                    });
                    const fmtTime = new Intl.DateTimeFormat(CONFIG.LOCALE, {
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: !CONFIG.USE_24_HOUR,
                        timeZone: CONFIG.TIMEZONE
                    });
                    const categoryIcons = { candles: '🕯️', havdalah: '✨', parashat: '📖', holiday: '✡️' };

                    const parsed = data.items.map(item => {
                        const d = new Date(item.date);
                        const hasTime = typeof item.date === 'string' && item.date.includes('T');
                        let subStr = '';
                        if (!isNaN(d.getTime())) {
                            subStr = hasTime ? `${fmtDay.format(d)} · ${fmtTime.format(d)}` : fmtDay.format(d);
                        }
                        const icon = categoryIcons[item.category] || '📅';
                        return { title: `${icon} ${item.title}`, sub: subStr };
                    });

                    localStorage.setItem(cacheKey, JSON.stringify(parsed));
                    renderHebcalEvents(parsed);
                    return;
                }
            } catch (err) {
                console.warn('Hebcal fetch failed, using cache/fallback:', err);
            }

            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                renderHebcalEvents(JSON.parse(cached));
            } else {
                renderHebcalEvents([{ title: '📅 Schedule unavailable', sub: 'Check connection' }]);
            }
        }

        function renderHebcalEvents(items) {
            const visible = items.slice(0, CONFIG.HEBCAL.MAX_ITEMS);
            DOM.hebcalEventsList.innerHTML = visible.map(item => `
                <div class="glass-panel rounded-xl px-3.5 py-2.5 shadow-lg">
                    <div class="font-semibold text-white leading-snug">${item.title}</div>
                    ${item.sub ? `<div class="text-[11px] sm:text-xs text-amber-200/90 mt-0.5 font-medium">${item.sub}</div>` : ''}
                </div>
            `).join('');
        }

        /* ==========================================================================
           KITCHEN TIMERS & TONE.JS AUDIO ENGINE
           ========================================================================== */
        async function playTimerChime() {
            try {
                await Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.1, release: 1.2 }
                }).toDestination();
                synth.volume.value = CONFIG.SOUND.CHIME_VOLUME_DB;

                const now = Tone.now();
                synth.triggerAttackRelease('C5', '8n', now);
                synth.triggerAttackRelease('E5', '8n', now + 0.18);
                synth.triggerAttackRelease('G5', '8n', now + 0.36);
                synth.triggerAttackRelease('C6', '4n', now + 0.54);
            } catch (err) {
                console.warn('Audio chime unavailable:', err);
            }
        }

        function startTimer(minutes) {
            clearTimer();
            state.timerEndTime = Date.now() + minutes * 60 * 1000;
            DOM.btnCancelTimer.classList.remove('hidden');
            updateTimerDisplay();
            state.timerInterval = setInterval(updateTimerDisplay, 500);
        }

        function updateTimerDisplay() {
            if (!state.timerEndTime) return;
            const remainingMs = state.timerEndTime - Date.now();
            if (remainingMs <= 0) {
                clearTimer();
                playTimerChime();
                return;
            }
            const totalSecs = Math.ceil(remainingMs / 1000);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            DOM.btnCancelTimer.textContent = `✕ ${mins}:${String(secs).padStart(2, '0')}`;
        }

        function clearTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            state.timerEndTime = null;
            DOM.btnCancelTimer.classList.add('hidden');
            DOM.btnCancelTimer.textContent = '✕ Stop';
        }

        async function cycleAmbientSound() {
            const modes = ['off', 'brown', 'rain', 'white'];
            const labels = {
                off: '🎧 Off',
                brown: '🌊 Brown',
                rain: '🌧️ Rain',
                white: '💨 White'
            };

            const nextMode = modes[(modes.indexOf(state.ambientMode) + 1) % modes.length];
            stopAmbientSound();
            state.ambientMode = nextMode;
            DOM.btnAmbientSound.textContent = labels[nextMode];

            if (nextMode === 'off') return;

            try {
                await Tone.start();
                const noiseType = nextMode === 'rain' ? 'pink' : nextMode;
                const noise = new Tone.Noise(noiseType);
                const filter = new Tone.Filter({
                    type: 'lowpass',
                    frequency: nextMode === 'brown' ? 320 : nextMode === 'rain' ? 950 : 2800
                }).toDestination();

                noise.volume.value = CONFIG.SOUND.VOLUME_DB;
                noise.connect(filter);
                noise.start();
                state.ambientNodes = { noise, filter };
            } catch (err) {
                console.warn('Ambient audio failed:', err);
                state.ambientMode = 'off';
                DOM.btnAmbientSound.textContent = labels.off;
            }
        }

        function stopAmbientSound() {
            if (state.ambientNodes) {
                try {
                    state.ambientNodes.noise.stop();
                    state.ambientNodes.noise.dispose();
                    state.ambientNodes.filter.dispose();
                } catch (_) {}
                state.ambientNodes = null;
            }
        }

        /* ==========================================================================
           OLED BURN-IN PIXEL SHIFT & NETWORK STATUS
           ========================================================================== */
        function applyPixelShift() {
            if (!CONFIG.PIXEL_SHIFT.ENABLED) return;
            const max = CONFIG.PIXEL_SHIFT.MAX_OFFSET_PX;
            const dx = Math.round((Math.random() * 2 - 1) * max);
            const dy = Math.round((Math.random() * 2 - 1) * max);
            DOM.root.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
        }

        function updateNetworkStatus() {
            if (navigator.onLine) {
                DOM.networkOfflinePill.classList.add('hidden');
            } else {
                DOM.networkOfflinePill.classList.remove('hidden');
            }
        }

        /* ==========================================================================
           EVENT LISTENERS & INITIALIZATION
           ========================================================================== */
        function initControls() {
            document.querySelectorAll('.timer-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mins = parseInt(btn.getAttribute('data-timer'), 10);
                    if (!isNaN(mins)) startTimer(mins);
                });
            });

            DOM.btnCancelTimer.addEventListener('click', clearTimer);
            DOM.btnAmbientSound.addEventListener('click', cycleAmbientSound);
            DOM.btnCycleBg.addEventListener('click', () => setWallpaper(state.bgCategory, true));

            DOM.btnToggleNight.addEventListener('click', () => {
                const currentlyNight = DOM.nightOverlay.style.opacity === '1';
                state.manualNightOverride = !currentlyNight;
                updateNightMode();
            });

            DOM.btnBlackout.addEventListener('click', () => {
                DOM.blackoutOverlay.classList.remove('hidden');
            });

            DOM.blackoutOverlay.addEventListener('click', () => {
                DOM.blackoutOverlay.classList.add('hidden');
            });

            document.body.addEventListener('dblclick', (e) => {
                if (e.target.closest('#control-dock')) return;
                DOM.blackoutOverlay.classList.toggle('hidden');
            });

            DOM.btnRefresh.addEventListener('click', () => {
                DOM.refreshIcon.style.transform = 'rotate(360deg)';
                setTimeout(() => { DOM.refreshIcon.style.transform = 'rotate(0deg)'; }, 550);
                fetchWeatherAndEnv();
                fetchHebcalCalendar();
            });

            window.addEventListener('online', () => {
                updateNetworkStatus();
                fetchWeatherAndEnv();
                fetchHebcalCalendar();
            });
            window.addEventListener('offline', updateNetworkStatus);
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            updateNetworkStatus();
            setWallpaper('clear', false);
            initControls();

            fetchWeatherAndEnv();
            fetchHebcalCalendar();

            setInterval(updateClock, CONFIG.CLOCK_INTERVAL_MS);
            setInterval(fetchWeatherAndEnv, CONFIG.WEATHER_INTERVAL_MS);
            setInterval(fetchHebcalCalendar, CONFIG.WEATHER_INTERVAL_MS * 3);
            setInterval(applyPixelShift, CONFIG.PIXEL_SHIFT.INTERVAL_MS);
        });
    </script>
</body>
</html>
