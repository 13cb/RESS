<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Show Smart Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tone.js for Local Kitchen Timer Chimes & Ambient Soundscapes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');

        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #090d16;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .text-shadow-heavy {
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.75), 0 0 36px rgba(0, 0, 0, 0.55);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
        }

        .glass-pill {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1.4s ease-in-out;
            will-change: opacity;
        }

        #dashboard-root {
            transition: transform 2.5s ease-in-out;
            will-change: transform;
        }

        #night-overlay {
            background: radial-gradient(circle at center, rgba(15, 8, 0, 0.55) 0%, rgba(0, 0, 0, 0.85) 100%);
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        #control-dock {
            opacity: 0.85;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #control-dock:hover,
        #control-dock:focus-within {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden">

    <!-- Dual Background Layers for Zero-Flicker Cross-Fades -->
    <div id="bg-layer-1" class="bg-layer z-0 opacity-100"></div>
    <div id="bg-layer-2" class="bg-layer z-0 opacity-0"></div>

    <!-- Ambient Contrast & Auto Night Mode Overlays -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/45 via-black/15 to-black/75 z-10 pointer-events-none"></div>
    <div id="night-overlay" class="absolute inset-0 z-30 opacity-0"></div>

    <!-- Full-Screen Blackout Sleep Overlay -->
    <div id="blackout-overlay" class="hidden fixed inset-0 bg-black z-50 cursor-pointer flex items-center justify-center">
        <span class="text-white/20 text-xs uppercase tracking-widest select-none">Tap anywhere to wake</span>
    </div>

    <!-- Bottom-Center Touch Control Dock -->
    <div id="control-dock" class="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-40 w-max max-w-[95vw]">
        <div class="glass-panel rounded-2xl p-2 sm:p-2.5 flex flex-wrap justify-center items-center gap-1.5 shadow-2xl text-xs sm:text-sm font-medium">
            <span class="text-[11px] font-bold uppercase tracking-wider text-white/60 px-1.5 hidden sm:inline">Timers</span>
            <button type="button" data-timer="5" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">⏱️ 5m</button>
            <button type="button" data-timer="10" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">10m</button>
            <button type="button" data-timer="15" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">15m</button>
            <button type="button" data-timer="30" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">30m</button>
            <button type="button" id="btn-cancel-timer" class="hidden px-2.5 py-1.5 rounded-xl bg-red-500/40 hover:bg-red-500/60 text-red-100 active:scale-95 transition">✕ Stop</button>

            <div class="h-4 w-px bg-white/20 mx-0.5"></div>

            <button type="button" id="btn-ambient-sound" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Ambient Soundscape">🎧 Off</button>
            <button type="button" id="btn-cycle-bg" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Cycle Wallpaper">🖼️ BG</button>
            <button type="button" id="btn-toggle-night" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Toggle Night Dimming">🌙 Night</button>
            <button type="button" id="btn-blackout" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Turn Screen Black">⬛ Off</button>
            <button type="button" id="btn-refresh" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Refresh Data"><span id="refresh-icon" class="inline-block transition-transform duration-500">🔄</span></button>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <main id="dashboard-root" class="relative z-20 h-full w-full p-5 sm:p-8 md:p-10">

        <!-- Top Header: Hebcal Schedule (Left) & Offline Badge (Right) -->
        <header class="relative z-30 flex justify-between items-start w-full pointer-events-none">
            <section id="hebcal-card" aria-live="polite" aria-label="Jewish calendar and Shabbat times" class="max-w-xs sm:max-w-sm pointer-events-auto">
                <div id="hebcal-events-list" class="flex flex-col gap-2 text-xs sm:text-sm text-white/95">
                    <div class="glass-panel rounded-xl px-3.5 py-2.5 text-white/60">Loading schedule...</div>
                </div>
            </section>

            <div id="network-offline-pill" class="hidden pointer-events-auto inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-500/30 border border-red-400/50 text-red-100 text-xs font-semibold animate-pulse">
                <span class="w-2 h-2 rounded-full bg-red-400"></span>
                <span>Offline</span>
            </div>
        </header>

        <!-- Centered Hero: Date, Clock & Weather -->
        <section class="fixed inset-0 z-20 flex flex-col items-center justify-center text-center text-shadow-heavy px-4 pointer-events-none">
            <div class="flex flex-col items-center justify-center w-full max-w-4xl gap-4 sm:gap-5">

                <!-- Stacked Date & Digital Clock -->
                <div class="flex items-center justify-center gap-3.5 sm:gap-5 md:gap-6">
                    <div aria-live="polite" class="flex flex-col items-center justify-center leading-none border-r border-white/25 pr-3.5 sm:pr-5 py-1">
                        <span id="date-month" class="text-xl sm:text-2xl md:text-3xl font-bold uppercase tracking-widest text-amber-200/95">---</span>
                        <span id="date-day" class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight tabular-nums mt-0.5">--</span>
                    </div>

                    <div aria-live="off" class="flex items-baseline gap-1.5 sm:gap-2.5">
                        <div id="time" class="text-7xl sm:text-8xl md:text-9xl lg:text-[10rem] font-black leading-none tracking-tight tabular-nums">--:--</div>
                        <div id="ampm" class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold opacity-90"></div>
                    </div>
                </div>

                <!-- Unified Weather Pill & Environmental Metric Pills -->
                <div aria-live="polite" aria-label="Current weather and environmental conditions" class="flex flex-col items-center gap-3.5 sm:gap-4 w-full">
                    <div class="glass-pill inline-flex items-center justify-center gap-2.5 sm:gap-3 px-4 py-1.5 sm:px-5 sm:py-2 rounded-full">
                        <span id="weather-icon" class="text-2xl sm:text-3xl md:text-4xl" aria-hidden="true">🌡️</span>
                        <span id="weather-temp" class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight tabular-nums">--°</span>
                        <span class="h-5 sm:h-6 w-px bg-white/25 mx-0.5" aria-hidden="true"></span>
                        <span id="weather-desc" class="text-base sm:text-xl md:text-2xl font-medium text-white/95">Loading weather...</span>
                    </div>

                    <div class="flex flex-wrap justify-center gap-1.5 sm:gap-2 max-w-2xl">
                        <span id="pill-feels" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-white/90 tabular-nums">Feels --°</span>
                        <span id="pill-rain" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-sky-200 tabular-nums">💧 --%</span>
                        <span id="pill-uv" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-amber-200 tabular-nums">☀️ UV --</span>
                        <span id="pill-aqi" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-emerald-200 tabular-nums">🍃 AQI --</span>
                        <span id="pill-sun" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-orange-200 tabular-nums">🌅 --:--</span>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <script>
        /* ==========================================================================
           MASTER CONFIGURATION
           ========================================================================== */
        const CONFIG = {
            LOCATION: {
                NAME: 'Teaneck, NJ',
                LAT: 40.8976,
                LON: -74.0154
            },
            TEMP_UNIT: 'fahrenheit',          // 'fahrenheit' or 'celsius'
            LOCALE: 'en-US',
            TIMEZONE: undefined,              // Leave undefined for system local timezone
            USE_24_HOUR: false,               // false = 12-hour (AM/PM), true = 24-hour

            HEBCAL: {
                ENABLED: true,
                CANDLE_LIGHTING_MINS: 18,
                HAVDALAH_MINS: 50,
                MAX_ITEMS: 4
            },

            NIGHT_MODE: {
                ENABLED: true,
                START_HOUR: 22,               // 10:00 PM
                END_HOUR: 6                   // 6:00 AM
            },

            PIXEL_SHIFT: {
                ENABLED: true,
                MAX_OFFSET_PX: 4,
                INTERVAL_MS: 15 * 60 * 1000
            },

            CLOCK_INTERVAL_MS: 1000,
            WEATHER_INTERVAL_MS: 10 * 60 * 1000,
            FETCH_TIMEOUT_MS: 8000,
            STORAGE_KEY: 'echo_dashboard_cache_v4',

            SOUND: {
                VOLUME_DB: -18,
                CHIME_VOLUME_DB: -10
            },

            BACKGROUNDS: {
                CLEAR_DAY: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80',
                CLEAR_NIGHT: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80',
                CLOUDY_DAY: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80',
                FOG: 'https://images.unsplash.com/photo-1487621167305-5d248087c724?auto=format&fit=crop&w=1920&q=80',
                RAIN: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1920&q=80',
                SNOW: 'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=1920&q=80',
                THUNDERSTORM: 'https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28?auto=format&fit=crop&w=1920&q=80',
                FALLBACK: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80'
            }
        };

        /* ==========================================================================
           STATE & DOM REFERENCES
           ========================================================================== */
        const state = {
            manualNightOverride: null,
            manualBgIndex: -1,
            activeBgLayer: 1,
            currentBgUrl: '',
            isBlackout: false,
            ambientIndex: 0,
            ambientNode: null,
            ambientGain: null,
            timerEndTime: null,
            timerInterval: null
        };

        const DOM = {
            root: document.getElementById('dashboard-root'),
            nightOverlay: document.getElementById('night-overlay'),
            blackoutOverlay: document.getElementById('blackout-overlay'),
            bgLayer1: document.getElementById('bg-layer-1'),
            bgLayer2: document.getElementById('bg-layer-2'),
            networkOfflinePill: document.getElementById('network-offline-pill'),
            weatherIcon: document.getElementById('weather-icon'),
            weatherTemp: document.getElementById('weather-temp'),
            weatherDesc: document.getElementById('weather-desc'),
            pillFeels: document.getElementById('pill-feels'),
            pillRain: document.getElementById('pill-rain'),
            pillUv: document.getElementById('pill-uv'),
            pillAqi: document.getElementById('pill-aqi'),
            pillSun: document.getElementById('pill-sun'),
            hebcalCard: document.getElementById('hebcal-card'),
            hebcalEventsList: document.getElementById('hebcal-events-list'),
            time: document.getElementById('time'),
            ampm: document.getElementById('ampm'),
            dateMonth: document.getElementById('date-month'),
            dateDay: document.getElementById('date-day'),
            btnCancelTimer: document.getElementById('btn-cancel-timer'),
            btnAmbientSound: document.getElementById('btn-ambient-sound'),
            btnCycleBg: document.getElementById('btn-cycle-bg'),
            btnToggleNight: document.getElementById('btn-toggle-night'),
            btnBlackout: document.getElementById('btn-blackout'),
            btnRefresh: document.getElementById('btn-refresh'),
            refreshIcon: document.getElementById('refresh-icon')
        };

        const monthFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, { month: 'short', timeZone: CONFIG.TIMEZONE });
        const dayFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, { day: 'numeric', timeZone: CONFIG.TIMEZONE });

        /* ==========================================================================
           CLOCK & NIGHT MODE
           ========================================================================== */
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');

            if (CONFIG.USE_24_HOUR) {
                DOM.time.textContent = `${hours.toString().padStart(2, '0')}:${minutes}`;
                DOM.ampm.textContent = '';
            } else {
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                DOM.time.textContent = `${hours}:${minutes}`;
                DOM.ampm.textContent = ampm;
            }

            DOM.dateMonth.textContent = monthFormatter.format(now).toUpperCase();
            DOM.dateDay.textContent = dayFormatter.format(now);
            updateNightMode(now);
        }

        function updateNightMode(now = new Date()) {
            if (!CONFIG.NIGHT_MODE.ENABLED && state.manualNightOverride === null) {
                DOM.nightOverlay.style.opacity = '0';
                return;
            }

            let isNight = false;
            if (state.manualNightOverride !== null) {
                isNight = state.manualNightOverride;
            } else {
                const h = now.getHours();
                const { START_HOUR, END_HOUR } = CONFIG.NIGHT_MODE;
                isNight = START_HOUR > END_HOUR
                    ? (h >= START_HOUR || h < END_HOUR)
                    : (h >= START_HOUR && h < END_HOUR);
            }

            DOM.nightOverlay.style.opacity = isNight ? '1' : '0';
            DOM.btnToggleNight.textContent = isNight ? '☀️ Day' : '🌙 Night';
        }

        /* ==========================================================================
           DYNAMIC WALLPAPER ENGINE
           ========================================================================== */
        function selectWeatherBackground(code, isDay) {
            if (state.manualBgIndex >= 0) {
                const keys = Object.keys(CONFIG.BACKGROUNDS);
                return CONFIG.BACKGROUNDS[keys[state.manualBgIndex % keys.length]];
            }

            if (code >= 95) return CONFIG.BACKGROUNDS.THUNDERSTORM;
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) return CONFIG.BACKGROUNDS.SNOW;
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return CONFIG.BACKGROUNDS.RAIN;
            if (code === 45 || code === 48) return CONFIG.BACKGROUNDS.FOG;
            if (!isDay) return CONFIG.BACKGROUNDS.CLEAR_NIGHT;
            if (code >= 2 && code <= 3) return CONFIG.BACKGROUNDS.CLOUDY_DAY;
            return CONFIG.BACKGROUNDS.CLEAR_DAY;
        }

        function setBackgroundImage(url) {
            if (!url || url === state.currentBgUrl) return;

            const preloader = new Image();
            preloader.onload = () => {
                state.currentBgUrl = url;
                const incoming = state.activeBgLayer === 1 ? DOM.bgLayer2 : DOM.bgLayer1;
                const outgoing = state.activeBgLayer === 1 ? DOM.bgLayer1 : DOM.bgLayer2;

                incoming.style.backgroundImage = `url("${url}")`;
                incoming.style.opacity = '1';
                outgoing.style.opacity = '0';
                state.activeBgLayer = state.activeBgLayer === 1 ? 2 : 1;
            };
            preloader.onerror = () => {
                if (url !== CONFIG.BACKGROUNDS.FALLBACK) {
                    setBackgroundImage(CONFIG.BACKGROUNDS.FALLBACK);
                }
            };
            preloader.src = url;
        }

        /* ==========================================================================
           WEATHER & AIR QUALITY
           ========================================================================== */
        const WEATHER_CODES = {
            0:  { text: 'Clear Sky', icon: '☀️' },
            1:  { text: 'Mainly Clear', icon: '🌤️' },
            2:  { text: 'Partly Cloudy', icon: '⛅' },
            3:  { text: 'Overcast', icon: '☁️' },
            45: { text: 'Foggy', icon: '🌫️' },
            48: { text: 'Rime Fog', icon: '🌫️' },
            51: { text: 'Light Drizzle', icon: '🌧️' },
            53: { text: 'Drizzle', icon: '🌧️' },
            55: { text: 'Dense Drizzle', icon: '🌧️' },
            61: { text: 'Light Rain', icon: '🌧️' },
            63: { text: 'Moderate Rain', icon: '🌧️' },
            65: { text: 'Heavy Rain', icon: '🌧️' },
            71: { text: 'Light Snow', icon: '❄️' },
            73: { text: 'Snowfall', icon: '❄️' },
            75: { text: 'Heavy Snow', icon: '❄️' },
            77: { text: 'Snow Grains', icon: '❄️' },
            80: { text: 'Rain Showers', icon: '🌦️' },
            81: { text: 'Moderate Showers', icon: '🌦️' },
            82: { text: 'Violent Showers', icon: '⛈️' },
            95: { text: 'Thunderstorm', icon: '⛈️' },
            96: { text: 'Storm & Hail', icon: '⛈️' },
            99: { text: 'Heavy Storm', icon: '⛈️' }
        };

        async function fetchWithTimeout(url, timeoutMs = CONFIG.FETCH_TIMEOUT_MS) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        function renderWeather(weatherData, aqiData, isCached = false) {
            if (!weatherData?.current) return;

            const cur = weatherData.current;
            const daily = weatherData.daily || {};
            const meta = WEATHER_CODES[cur.weather_code] || { text: 'Clear', icon: '🌡️' };

            DOM.weatherIcon.textContent = meta.icon;
            DOM.weatherTemp.textContent = `${Math.round(cur.temperature_2m)}°`;
            DOM.weatherDesc.textContent = isCached ? `${meta.text} (Cached)` : meta.text;

            const feels = cur.apparent_temperature !== undefined ? Math.round(cur.apparent_temperature) : '--';
            const rainProb = daily.precipitation_probability_max?.[0] ?? '--';
            const uvMax = daily.uv_index_max?.[0] !== undefined ? Math.round(daily.uv_index_max[0]) : '--';
            const usAqi = aqiData?.current?.us_aqi !== undefined ? Math.round(aqiData.current.us_aqi) : '--';

            DOM.pillFeels.textContent = `Feels ${feels}°`;
            DOM.pillRain.textContent = `💧 ${rainProb}%`;
            DOM.pillUv.textContent = `☀️ UV ${uvMax}`;
            DOM.pillAqi.textContent = `🍃 AQI ${usAqi}`;

            if (daily.sunrise && daily.sunset) {
                const now = new Date();
                const sunrise = new Date(daily.sunrise[0]);
                const sunset = new Date(daily.sunset[0]);
                const fmt = new Intl.DateTimeFormat(CONFIG.LOCALE, {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: !CONFIG.USE_24_HOUR
                });

                DOM.pillSun.textContent = (now >= sunrise && now < sunset)
                    ? `🌇 ${fmt.format(sunset)}`
                    : `🌅 ${fmt.format(sunrise)}`;
            }

            setBackgroundImage(selectWeatherBackground(cur.weather_code, Boolean(cur.is_day)));
        }

        async function fetchWeatherAndEnv() {
            const { LAT, LON } = CONFIG.LOCATION;
            const cacheKey = `${CONFIG.STORAGE_KEY}_${LAT}_${LON}_${CONFIG.TEMP_UNIT}`;

            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,is_day,weather_code&daily=sunrise,sunset,uv_index_max,precipitation_probability_max&temperature_unit=${CONFIG.TEMP_UNIT}&timezone=auto&forecast_days=1`;
            const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi`;

            try {
                const [weatherData, aqiData] = await Promise.all([
                    fetchWithTimeout(weatherUrl),
                    fetchWithTimeout(aqiUrl).catch(() => null)
                ]);

                localStorage.setItem(cacheKey, JSON.stringify({ weatherData, aqiData }));
                renderWeather(weatherData, aqiData, false);
            } catch (err) {
                console.warn('Weather fetch failed, attempting cache fallback:', err);
                try {
                    const cached = JSON.parse(localStorage.getItem(cacheKey));
                    if (cached) {
                        renderWeather(cached.weatherData, cached.aqiData, true);
                        return;
                    }
                } catch (_) {}
                DOM.weatherDesc.textContent = 'Weather Unavailable';
                setBackgroundImage(CONFIG.BACKGROUNDS.FALLBACK);
            }
        }

        /* ==========================================================================
           HEBCAL SHABBAT & JEWISH HOLIDAY CALENDAR
           ========================================================================== */
        function generateLocalShabbatFallback() {
            const now = new Date();
            const daysUntilFriday = (5 - now.getDay() + 7) % 7;
            const friday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilFriday);
            const saturday = new Date(friday.getFullYear(), friday.getMonth(), friday.getDate() + 1);
            const fmtDate = new Intl.DateTimeFormat(CONFIG.LOCALE, { weekday: 'short', month: 'short', day: 'numeric' });

            return [
                { title: '🕯️ Candle Lighting', sub: `${fmtDate.format(friday)} · ~18m before sunset` },
                { title: '✨ Havdalah', sub: `${fmtDate.format(saturday)} · Nightfall` }
            ];
        }

        function renderHebcalEvents(items) {
            if (!items?.length) {
                DOM.hebcalEventsList.innerHTML = `<div class="glass-panel rounded-xl px-3.5 py-2.5 text-white/70 shadow-lg">No upcoming events</div>`;
                return;
            }

            DOM.hebcalEventsList.innerHTML = items.slice(0, CONFIG.HEBCAL.MAX_ITEMS).map(ev => `
                <div class="glass-panel rounded-xl px-3.5 py-2.5 shadow-lg flex flex-col leading-tight">
                    <span class="font-semibold text-white">${ev.title}</span>
                    ${ev.sub ? `<span class="text-[11px] text-white/70 mt-0.5">${ev.sub}</span>` : ''}
                </div>
            `).join('');
        }

        async function fetchHebcalCalendar() {
            if (!CONFIG.HEBCAL.ENABLED) {
                DOM.hebcalCard.classList.add('hidden');
                return;
            }

            const cacheKey = `${CONFIG.STORAGE_KEY}_hebcal_v4`;
            const { LAT, LON } = CONFIG.LOCATION;
            const url = `https://www.hebcal.com/shabbat?cfg=json&geo=pos&latitude=${LAT}&longitude=${LON}&tzid=America/New_York&M=on&b=${CONFIG.HEBCAL.CANDLE_LIGHTING_MINS}&m=${CONFIG.HEBCAL.HAVDALAH_MINS}`;

            try {
                const data = await fetchWithTimeout(url);
                if (Array.isArray(data?.items)) {
                    const fmtDay = new Intl.DateTimeFormat(CONFIG.LOCALE, { weekday: 'short', month: 'short', day: 'numeric' });
                    const categoryIcons = { candles: '🕯️', havdalah: '✨', parashat: '📖', holiday: '✡️' };

                    const parsed = data.items.map(item => {
                        const d = new Date(item.date);
                        const dayStr = !isNaN(d.getTime()) ? fmtDay.format(d) : '';
                        const icon = categoryIcons[item.category] || '📅';
                        return { title: `${icon} ${item.title}`, sub: dayStr };
                    });

                    localStorage.setItem(cacheKey, JSON.stringify(parsed));
                    renderHebcalEvents(parsed);
                    return;
                }
            } catch (err) {
                console.warn('Hebcal fetch failed, using cache/fallback:', err);
            }

            try {
                const cached = JSON.parse(localStorage.getItem(cacheKey));
                if (cached) {
                    renderHebcalEvents(cached);
                    return;
                }
            } catch (_) {}

            renderHebcalEvents(generateLocalShabbatFallback());
        }

        /* ==========================================================================
           KITCHEN TIMERS & TONE.JS AMBIENT SOUNDSCAPES
           ========================================================================== */
        async function playTimerChime() {
            try {
                await Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.05, decay: 0.4, sustain: 0.2, release: 1.5 }
                }).toDestination();
                synth.volume.value = CONFIG.SOUND.CHIME_VOLUME_DB;

                const now = Tone.now();
                ['C5', 'E5', 'G5'].forEach((note, idx) => synth.triggerAttackRelease(note, '8n', now + idx * 0.2));
                synth.triggerAttackRelease('C6', '2n', now + 0.6);
            } catch (e) {
                console.warn('Audio chime blocked:', e);
            }
        }

        function startTimer(minutes) {
            stopTimer();
            state.timerEndTime = Date.now() + minutes * 60 * 1000;
            DOM.btnCancelTimer.classList.remove('hidden');

            const tick = () => {
                const remainingMs = state.timerEndTime - Date.now();
                if (remainingMs <= 0) {
                    stopTimer();
                    playTimerChime();
                    return;
                }
                const totalSec = Math.ceil(remainingMs / 1000);
                const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
                const s = (totalSec % 60).toString().padStart(2, '0');
                DOM.btnCancelTimer.textContent = `✕ ${m}:${s}`;
            };

            tick();
            state.timerInterval = setInterval(tick, 500);
        }

        function stopTimer() {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
            state.timerEndTime = null;
            DOM.btnCancelTimer.classList.add('hidden');
            DOM.btnCancelTimer.textContent = '✕ Stop';
        }

        async function cycleAmbientSound() {
            state.ambientIndex = (state.ambientIndex + 1) % 4;

            if (state.ambientNode) {
                try { state.ambientNode.stop(); state.ambientNode.dispose(); } catch (_) {}
                state.ambientNode = null;
            }
            if (state.ambientGain) {
                try { state.ambientGain.dispose(); } catch (_) {}
                state.ambientGain = null;
            }

            const labels = ['🎧 Off', '🎧 Brown', '🌧️ Rain', '🎧 White'];
            DOM.btnAmbientSound.textContent = labels[state.ambientIndex];

            if (state.ambientIndex === 0) return;

            try {
                await Tone.start();
                const types = ['', 'brown', 'pink', 'white'];
                const gain = new Tone.Gain(Tone.dbToGain(CONFIG.SOUND.VOLUME_DB)).toDestination();
                const noise = new Tone.Noise(types[state.ambientIndex]);

                if (state.ambientIndex === 2) {
                    noise.connect(new Tone.Filter(650, 'lowpass').connect(gain));
                } else {
                    noise.connect(gain);
                }

                noise.start();
                state.ambientNode = noise;
                state.ambientGain = gain;
            } catch (err) {
                console.warn('Ambient audio failed:', err);
                state.ambientIndex = 0;
                DOM.btnAmbientSound.textContent = '🎧 Off';
            }
        }

        /* ==========================================================================
           HARDWARE PROTECTION & CONTROLS
           ========================================================================== */
        function initPixelShift() {
            if (!CONFIG.PIXEL_SHIFT.ENABLED) return;
            setInterval(() => {
                const max = CONFIG.PIXEL_SHIFT.MAX_OFFSET_PX;
                const dx = Math.floor(Math.random() * (max * 2 + 1)) - max;
                const dy = Math.floor(Math.random() * (max * 2 + 1)) - max;
                DOM.root.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
            }, CONFIG.PIXEL_SHIFT.INTERVAL_MS);
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); } catch (_) {}
            }
        }

        function initNetworkMonitor() {
            const updateStatus = () => DOM.networkOfflinePill.classList.toggle('hidden', navigator.onLine);
            window.addEventListener('online', () => {
                updateStatus();
                fetchWeatherAndEnv();
                fetchHebcalCalendar();
            });
            window.addEventListener('offline', updateStatus);
            updateStatus();
        }

        function setBlackoutMode(active) {
            state.isBlackout = active;
            DOM.blackoutOverlay.classList.toggle('hidden', !active);
        }

        function initControls() {
            DOM.blackoutOverlay.addEventListener('click', (e) => {
                e.stopPropagation();
                setBlackoutMode(false);
            });

            document.body.addEventListener('dblclick', (e) => {
                if (e.target.closest('#control-dock') || state.isBlackout) return;
                setBlackoutMode(true);
            });

            document.querySelectorAll('.timer-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startTimer(parseInt(btn.dataset.timer, 10));
                });
            });

            DOM.btnCancelTimer.addEventListener('click', (e) => {
                e.stopPropagation();
                stopTimer();
            });

            DOM.btnAmbientSound.addEventListener('click', (e) => {
                e.stopPropagation();
                cycleAmbientSound();
            });

            DOM.btnCycleBg.addEventListener('click', (e) => {
                e.stopPropagation();
                const keys = Object.keys(CONFIG.BACKGROUNDS);
                state.manualBgIndex = (state.manualBgIndex + 1) % keys.length;
                setBackgroundImage(CONFIG.BACKGROUNDS[keys[state.manualBgIndex]]);
            });

            DOM.btnToggleNight.addEventListener('click', (e) => {
                e.stopPropagation();
                const currentlyNight = parseFloat(DOM.nightOverlay.style.opacity || '0') > 0.5;
                state.manualNightOverride = !currentlyNight;
                updateNightMode();
            });

            DOM.btnBlackout.addEventListener('click', (e) => {
                e.stopPropagation();
                setBlackoutMode(true);
            });

            DOM.btnRefresh.addEventListener('click', (e) => {
                e.stopPropagation();
                state.manualBgIndex = -1;
                DOM.refreshIcon.style.transform = 'rotate(360deg)';
                setTimeout(() => { DOM.refreshIcon.style.transform = 'rotate(0deg)'; }, 550);
                fetchWeatherAndEnv();
                fetchHebcalCalendar();
            });
        }

        /* ==========================================================================
           INITIALIZATION
           ========================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            setBackgroundImage(CONFIG.BACKGROUNDS.CLEAR_DAY);
            updateClock();
            setInterval(updateClock, CONFIG.CLOCK_INTERVAL_MS);

            fetchWeatherAndEnv();
            fetchHebcalCalendar();
            setInterval(() => {
                fetchWeatherAndEnv();
                fetchHebcalCalendar();
            }, CONFIG.WEATHER_INTERVAL_MS);

            initControls();
            initPixelShift();
            initNetworkMonitor();
            requestWakeLock();

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') requestWakeLock();
            });
        });
    </script>
</body>
</html>
