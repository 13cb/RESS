<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Show Smart Dashboard</title>

    <script>
        /* ==========================================================================
           EASY CUSTOMIZATION SETTINGS (EDIT HERE!)
           ==========================================================================
           Change your city/location, coordinates, timezone, and calendar rules below.
           You do NOT need to touch any other code in this file!
           ========================================================================== */
        const USER_SETTINGS = {
            // 1. WEATHER & CALENDAR LOCATION
            // Tip: Find your exact Latitude & Longitude on Google Maps (right-click any spot).
            LOCATION_NAME: 'Teaneck, NJ',
            LATITUDE: 40.8976,
            LONGITUDE: -74.0154,

            // 2. TIMEZONE (Used for Clock & Hebcal Shabbat/Holiday Times)
            // Examples: 'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'Asia/Jerusalem', 'Europe/London'
            TIMEZONE: 'America/New_York',

            // 3. TEMPERATURE & CLOCK FORMAT
            TEMP_UNIT: 'fahrenheit',          // 'fahrenheit' or 'celsius'
            USE_24_HOUR: false,               // false = 12-hour (AM/PM), true = 24-hour

            // 4. HEBCAL SHABBAT & HOLIDAY CALENDAR SETTINGS
            HEBCAL_ENABLED: true,             // true to show Hebcal events, false to hide
            CANDLE_LIGHTING_MINS: 18,         // Minutes before sunset (e.g., 18, 20, 30, 40)
            HAVDALAH_MINS: 5,                 // Minutes after sunset for Havdalah (e.g., 42, 50, 72)
            ISRAEL_SCHEDULE: false,           // true if located in Israel (1-day Yom Tov & Israeli Parsha), false for Diaspora
            MAX_CALENDAR_ITEMS: 5,            // Maximum number of event cards to show in top-left

            // 5. AUTO NIGHT DIMMING & BEDSIDE RED/AMBER CLOCK MODE (24-hour format: 0 to 23)
            NIGHT_MODE_ENABLED: true,
            NIGHT_START_HOUR: 22,             // 22 = 10:00 PM (Dimmed Night Mode)
            BEDSIDE_START_HOUR: 23,           // 23 = 11:00 PM (Deep Red/Amber Bedside Mode)
            NIGHT_END_HOUR: 6                 // 6 = 6:00 AM
        };
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tone.js for Local Kitchen Timer Chimes & Ambient Soundscapes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');

        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #090d16;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .text-shadow-heavy {
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.75), 0 0 36px rgba(0, 0, 0, 0.55);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
        }

        .glass-pill {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1.4s ease-in-out;
            will-change: opacity;
        }

        #dashboard-root {
            transition: transform 2.5s ease-in-out;
            will-change: transform;
        }

        #night-overlay {
            background: radial-gradient(circle at center, rgba(15, 8, 0, 0.55) 0%, rgba(0, 0, 0, 0.85) 100%);
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        /* Deep Red/Amber Bedside Clock Mode for Night-Vision Preservation */
        body.bedside-mode #bg-layer-1,
        body.bedside-mode #bg-layer-2 {
            opacity: 0.08 !important;
            filter: grayscale(100%) brightness(0.3);
        }
        body.bedside-mode #night-overlay {
            background: radial-gradient(circle at center, rgba(20, 3, 0, 0.88) 0%, rgba(0, 0, 0, 0.97) 100%);
            opacity: 1 !important;
        }
        body.bedside-mode #dashboard-root {
            filter: sepia(100%) hue-rotate(-38deg) saturate(420%) brightness(0.68);
        }
        body.bedside-mode #control-dock {
            opacity: 0.45;
            filter: sepia(100%) hue-rotate(-38deg) saturate(350%) brightness(0.65);
        }
        body.bedside-mode #control-dock:hover {
            opacity: 0.95;
        }

        #control-dock {
            opacity: 0.85;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #control-dock:hover,
        #control-dock:focus-within {
            opacity: 1;
        }

        /* iOS 26 Control Center Vertical Timer Capsule Slider */
        .ios-timer-capsule {
            background: rgba(15, 23, 42, 0.58);
            backdrop-filter: blur(32px) saturate(190%);
            -webkit-backdrop-filter: blur(32px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 28px 56px -12px rgba(0, 0, 0, 0.72), inset 0 1px 1.5px rgba(255, 255, 255, 0.28);
        }

        .ios-timer-fill {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(253, 224, 71, 0.92) 45%, rgba(245, 158, 11, 0.92) 100%);
            box-shadow: 0 -6px 22px rgba(251, 191, 36, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.7);
            transition: height 0.08s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .active-timer-pill {
            background: rgba(15, 23, 42, 0.62);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(252, 211, 77, 0.42);
            box-shadow: 0 16px 38px -8px rgba(0, 0, 0, 0.65), 0 0 24px -4px rgba(251, 191, 36, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        /* Smoothly shift center hero left based on viewport width while timer slider is open */
        #hero-content {
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        body.timer-picker-open #hero-content {
            transform: translateX(clamp(-19rem, calc(-23vw + 3rem), -3.5rem));
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden">

    <!-- Dual Cross-Fading Background Wallpaper Layers -->
    <div id="bg-layer-1" class="bg-layer opacity-100 z-0"></div>
    <div id="bg-layer-2" class="bg-layer opacity-0 z-0"></div>

    <!-- Night Dimming & Bedside Vignette Overlay -->
    <div id="night-overlay" class="fixed inset-0 opacity-0 z-10"></div>

    <!-- Full-Screen Blackout Sleep Overlay -->
    <div id="blackout-overlay" class="hidden fixed inset-0 bg-black z-50 cursor-pointer flex items-center justify-center">
        <span class="text-white/20 text-xs uppercase tracking-widest select-none">Tap anywhere to wake</span>
    </div>

    <!-- Top-Center Active Timer Pill -->
    <div id="top-timer-pill" class="hidden fixed top-5 sm:top-7 left-1/2 -translate-x-1/2 z-40 pointer-events-auto">
        <div class="active-timer-pill rounded-full px-5 py-2.5 sm:px-6 sm:py-3 flex items-center gap-3.5 sm:gap-4 transition-all duration-300">
            <!-- Live Progress Ring -->
            <div class="relative w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center shrink-0">
                <svg class="w-full h-full -rotate-90" viewBox="0 0 36 36" aria-hidden="true">
                    <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="3.2"></circle>
                    <circle id="top-timer-ring" cx="18" cy="18" r="15" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="0" class="transition-all duration-200"></circle>
                </svg>
                <span class="absolute h-2 w-2 rounded-full bg-amber-300 animate-pulse"></span>
            </div>

            <div class="flex items-baseline gap-2.5">
                <span class="text-xs sm:text-sm font-bold uppercase tracking-widest text-amber-200/90">Timer</span>
                <span id="top-timer-countdown" class="text-xl sm:text-2xl font-black text-white tabular-nums tracking-tight leading-none">05:00</span>
            </div>

            <button type="button" id="btn-top-cancel-timer" class="ml-1 w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white/15 hover:bg-red-500/75 text-white/90 hover:text-white flex items-center justify-center text-sm font-bold transition active:scale-90 border border-white/10" title="Cancel Timer" aria-label="Cancel Timer">✕</button>
        </div>
    </div>

    <!-- iOS 26 Control Center Timer Selector Popover -->
    <div id="ios-timer-popover" class="hidden fixed right-[clamp(7.25rem,9vw,10rem)] top-1/2 -translate-y-1/2 z-50 flex flex-col items-center gap-2.5 sm:gap-3 select-none">
        <div id="ios-timer-track" role="slider" aria-label="Timer Duration" aria-valuemin="1" aria-valuemax="60" aria-valuenow="5" tabindex="0" class="ios-timer-capsule relative w-24 sm:w-28 h-[clamp(13.5rem,62vh,24rem)] rounded-[2.5rem] sm:rounded-[2.75rem] overflow-hidden cursor-ns-resize touch-none flex flex-col justify-end">
            <!-- Dynamic Fill -->
            <div id="ios-timer-fill" class="ios-timer-fill w-full pointer-events-none" style="height: 8.33%;"></div>

            <!-- Centered Readout Overlay -->
            <div class="absolute inset-0 flex flex-col items-center justify-between py-4 sm:py-5 pointer-events-none mix-blend-difference text-white">
                <span class="text-lg sm:text-2xl">⏱️</span>
                <div class="flex flex-col items-center leading-none">
                    <span id="ios-timer-value" class="text-3xl sm:text-4xl font-black tabular-nums">5</span>
                    <span class="text-xs font-bold uppercase tracking-widest mt-1 opacity-90">min</span>
                </div>
                <span class="text-[11px] font-semibold uppercase tracking-wider opacity-80">Slide</span>
            </div>
        </div>

        <button type="button" id="btn-ios-timer-start" class="ios-timer-capsule px-5 sm:px-6 py-1.5 sm:py-2 rounded-full text-sm sm:text-base font-bold text-amber-200 hover:text-white hover:bg-white/20 active:scale-95 transition shadow-xl">
            Start 5m
        </button>
    </div>

    <!-- Right-Side Vertical Touch Control Panels (Separated) -->
    <div id="control-dock" class="fixed right-4 sm:right-6 top-1/2 -translate-y-1/2 z-40 flex flex-col gap-2.5 text-xs sm:text-sm font-medium min-w-[5.25rem] sm:min-w-[6rem]">
        <!-- Timer Panel -->
        <div class="glass-panel rounded-2xl p-2 shadow-2xl">
            <button type="button" id="btn-open-timer" class="w-full px-2.5 py-2 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center font-semibold" title="Set Timer">⏱️ Timer</button>
        </div>

        <!-- Ambient Sounds Panel -->
        <div class="glass-panel rounded-2xl p-2 flex flex-col items-stretch gap-1 shadow-2xl">
            <button type="button" data-sound="white" class="sound-btn w-full px-2 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center" title="White Noise">💨 White</button>
            <button type="button" data-sound="fan" class="sound-btn w-full px-2 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center" title="Box Fan">🌀 Fan</button>
            <button type="button" data-sound="brown" class="sound-btn w-full px-2 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center" title="Brown Noise">🌊 Brown</button>
            <button type="button" data-sound="rain" class="sound-btn w-full px-2 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center" title="Rainfall">🌧️ Rain</button>
            <button type="button" data-sound="bowl" class="sound-btn w-full px-2 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center" title="Singing Bowls">🔔 Bowl</button>
        </div>

        <!-- Display & Refresh Panel -->
        <div class="glass-panel rounded-2xl p-2 flex flex-col items-stretch gap-1 shadow-2xl">
            <button type="button" id="btn-toggle-night" class="w-full px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center" title="Toggle Day / Night / Bedside Mode">🌙 Night</button>
            <button type="button" id="btn-blackout" class="w-full px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center" title="Turn Screen Black">⬛ Off</button>
            <button type="button" id="btn-refresh" class="w-full px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition text-center" title="Refresh Data"><span id="refresh-icon" class="inline-block transition-transform duration-500">🔄</span></button>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <main id="dashboard-root" class="relative z-20 h-full w-full p-5 sm:p-8 md:p-10">

        <!-- Top Header: Hebcal Schedule (Left) & Offline Badge (Right) -->
        <header class="relative z-30 flex justify-between items-start w-full pointer-events-none">
            <section id="hebcal-card" aria-live="polite" aria-label="Jewish calendar and Shabbat times" class="w-full max-w-[clamp(9.75rem,min(22vw,39vh),25rem)] pointer-events-auto">
                <div id="hebcal-events-list" class="flex flex-col gap-[clamp(0.35rem,1.05vh,0.75rem)] text-[clamp(0.75rem,min(1.1vw,2.4vh),1.2rem)] text-white/95">
                    <div class="glass-panel rounded-[clamp(0.75rem,1.75vh,1.15rem)] px-[clamp(0.65rem,1.15vw,1.15rem)] py-[clamp(0.4rem,1.15vh,0.85rem)] text-white/60">Loading schedule...</div>
                </div>
            </section>

            <div id="network-offline-pill" class="hidden pointer-events-auto inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-500/30 border border-red-400/50 text-red-100 text-xs font-semibold animate-pulse">
                <span class="w-2 h-2 rounded-full bg-red-400"></span>
                <span>Offline</span>
            </div>
        </header>

        <!-- Centered Hero: Date, Clock & Weather -->
        <section id="hero-section" class="fixed inset-0 z-20 flex flex-col items-center justify-center text-center text-shadow-heavy px-[clamp(1rem,23vw,25rem)] pointer-events-none">
            <div id="hero-content" class="flex flex-col items-center justify-center w-full max-w-3xl gap-4 sm:gap-5">

                <!-- Stacked Date & Digital Clock -->
                <div class="flex items-center justify-center gap-3 sm:gap-4 md:gap-5">
                    <div aria-live="polite" class="flex flex-col items-center justify-center leading-none border-r border-white/25 pr-3 sm:pr-4 py-1">
                        <span id="date-month" class="text-[clamp(1rem,1.6vw,1.75rem)] font-bold uppercase tracking-widest text-amber-200/95">---</span>
                        <span id="date-day" class="text-[clamp(1.65rem,2.6vw,2.85rem)] font-black tracking-tight tabular-nums mt-0.5">--</span>
                    </div>

                    <div aria-live="off" class="flex items-baseline gap-1.5 sm:gap-2">
                        <div id="time" class="text-[clamp(3.75rem,8.5vw,8.75rem)] font-black leading-none tracking-tight tabular-nums">--:--</div>
                        <div id="ampm" class="text-[clamp(1.1rem,2vw,2.15rem)] font-bold opacity-90"></div>
                    </div>
                </div>

                <!-- Unified Weather Pill & Environmental Metric Pills -->
                <div aria-live="polite" aria-label="Current weather and environmental conditions" class="flex flex-col items-center gap-3.5 sm:gap-4 w-full">
                    <div class="glass-pill inline-flex items-center justify-center gap-2.5 sm:gap-3 px-4 py-1.5 sm:px-5 sm:py-2 rounded-full">
                        <span id="weather-icon" class="text-2xl sm:text-3xl md:text-4xl" aria-hidden="true">🌡️</span>
                        <span id="weather-temp" class="text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight tabular-nums">--°</span>
                        <span class="h-5 sm:h-6 w-px bg-white/25 mx-0.5" aria-hidden="true"></span>
                        <span id="weather-desc" class="text-base sm:text-xl md:text-2xl font-medium text-white/95">Loading weather...</span>
                    </div>

                    <div class="flex flex-wrap justify-center gap-1.5 sm:gap-2 max-w-2xl">
                        <span id="pill-feels" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-white/90 tabular-nums">Feels --°</span>
                        <span id="pill-rain" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-sky-200 tabular-nums">💧 --%</span>
                        <span id="pill-uv" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-amber-200 tabular-nums">☀️ UV --</span>
                        <span id="pill-aqi" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-emerald-200 tabular-nums">🍃 AQI --</span>
                        <span id="pill-sun" class="glass-pill px-3 py-1 rounded-full text-xs font-medium text-orange-200 tabular-nums">🌅 --:--</span>
                    </div>

                    <!-- Severe Weather / Frost Alert Pill (Only shown when triggered) -->
                    <div id="weather-alert-pill" class="hidden inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-amber-500/25 border border-amber-300/50 text-amber-100 text-xs sm:text-sm font-semibold shadow-lg backdrop-blur-md">
                        <span id="weather-alert-icon">⚠️</span>
                        <span id="weather-alert-text">Frost Advisory</span>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <script>
        /* ==========================================================================
           INTERNAL CONFIGURATION (MAPPED FROM USER_SETTINGS ABOVE)
           ========================================================================== */
        const CONFIG = {
            LOCATION: {
                NAME: USER_SETTINGS.LOCATION_NAME,
                LAT: Number(USER_SETTINGS.LATITUDE),
                LON: Number(USER_SETTINGS.LONGITUDE)
            },
            TEMP_UNIT: USER_SETTINGS.TEMP_UNIT,
            LOCALE: 'en-US',
            TIMEZONE: USER_SETTINGS.TIMEZONE || Intl.DateTimeFormat().resolvedOptions().timeZone,
            USE_24_HOUR: USER_SETTINGS.USE_24_HOUR,

            HEBCAL: {
                ENABLED: USER_SETTINGS.HEBCAL_ENABLED,
                CANDLE_LIGHTING_MINS: USER_SETTINGS.CANDLE_LIGHTING_MINS,
                HAVDALAH_MINS: USER_SETTINGS.HAVDALAH_MINS,
                ISRAEL: USER_SETTINGS.ISRAEL_SCHEDULE,
                MAX_ITEMS: USER_SETTINGS.MAX_CALENDAR_ITEMS
            },

            NIGHT_MODE: {
                ENABLED: USER_SETTINGS.NIGHT_MODE_ENABLED,
                START_HOUR: USER_SETTINGS.NIGHT_START_HOUR,
                BEDSIDE_START_HOUR: USER_SETTINGS.BEDSIDE_START_HOUR,
                END_HOUR: USER_SETTINGS.NIGHT_END_HOUR
            },

            PIXEL_SHIFT: {
                ENABLED: true,
                MAX_OFFSET_PX: 4,
                INTERVAL_MS: 15 * 60 * 1000
            },

            CLOCK_INTERVAL_MS: 1000,
            WEATHER_INTERVAL_MS: 10 * 60 * 1000,
            FETCH_TIMEOUT_MS: 8000,
            STORAGE_KEY: 'echo_dashboard_cache_v5',

            SOUND: {
                VOLUME_DB: -18,
                CHIME_VOLUME_DB: -10
            },

            FALLBACK_WALLPAPERS: [
                'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=85',
                'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=85',
                'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=85',
                'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=85'
            ],

            WEATHER_WALLPAPERS: {
                clear: [
                    'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1920&q=85'
                ],
                cloudy: [
                    'https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?auto=format&fit=crop&w=1920&q=85'
                ],
                rain: [
                    'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1534274988757-a28bf1a57c17?auto=format&fit=crop&w=1920&q=85'
                ],
                snow: [
                    'https://images.unsplash.com/photo-1491002052546-bf38f186af56?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=1920&q=85'
                ],
                night: [
                    'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=85',
                    'https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?auto=format&fit=crop&w=1920&q=85'
                ]
            }
        };

        /* ==========================================================================
           DOM ELEMENT CACHE & APPLICATION STATE
           ========================================================================== */
        const DOM = {
            root: document.getElementById('dashboard-root'),
            bg1: document.getElementById('bg-layer-1'),
            bg2: document.getElementById('bg-layer-2'),
            nightOverlay: document.getElementById('night-overlay'),
            blackoutOverlay: document.getElementById('blackout-overlay'),
            networkOfflinePill: document.getElementById('network-offline-pill'),
            hebcalCard: document.getElementById('hebcal-card'),
            hebcalEventsList: document.getElementById('hebcal-events-list'),
            dateMonth: document.getElementById('date-month'),
            dateDay: document.getElementById('date-day'),
            time: document.getElementById('time'),
            ampm: document.getElementById('ampm'),
            weatherIcon: document.getElementById('weather-icon'),
            weatherTemp: document.getElementById('weather-temp'),
            weatherDesc: document.getElementById('weather-desc'),
            pillFeels: document.getElementById('pill-feels'),
            pillRain: document.getElementById('pill-rain'),
            pillUv: document.getElementById('pill-uv'),
            pillAqi: document.getElementById('pill-aqi'),
            pillSun: document.getElementById('pill-sun'),
            weatherAlertPill: document.getElementById('weather-alert-pill'),
            weatherAlertIcon: document.getElementById('weather-alert-icon'),
            weatherAlertText: document.getElementById('weather-alert-text'),

        /* ==========================================================================
           DATE & TIME FORMATTERS

        const timePartsFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, {

        });

        /* ==========================================================================
           CACHE & NETWORK UTILITIES
           ========================================================================== */
        function readCache() {
            try {
                const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch {
                return {};
            }
        }

        function writeCache(patch) {
            try {
                const current = readCache();
                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify({ ...current, ...patch }));
            } catch {
                // Ignore storage quota errors
            }
        }

        async function fetchWithTimeout(url, timeoutMs = CONFIG.FETCH_TIMEOUT_MS) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { signal: controller.signal });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } finally {
                clearTimeout(timer);
            }
        }

        function updateNetworkStatus() {
            DOM.networkOfflinePill.classList.toggle('hidden', navigator.onLine);
        }

        /* ==========================================================================
           CLOCK, DISPLAY MODE (DAY / NIGHT / BEDSIDE) & CANDLE COUNTDOWN
           ========================================================================== */
        function getConfiguredHour(now) {
            const h = parseInt(hour24Formatter.format(now), 10);
            return h === 24 ? 0 : h;
        }

        function determineDisplayMode(now) {
            if (state.nightModeOverride) return state.nightModeOverride;
            if (!CONFIG.NIGHT_MODE.ENABLED) return 'day';

            const hour = getConfiguredHour(now);
            const { START_HOUR, BEDSIDE_START_HOUR, END_HOUR } = CONFIG.NIGHT_MODE;

            const isBedsideWindow = BEDSIDE_START_HOUR > END_HOUR
                ? (hour >= BEDSIDE_START_HOUR || hour < END_HOUR)
                : (hour >= BEDSIDE_START_HOUR && hour < END_HOUR);

            if (isBedsideWindow) return 'bedside';

            const isNightWindow = START_HOUR > END_HOUR
                ? (hour >= START_HOUR || hour < END_HOUR)
                : (hour >= START_HOUR && hour < END_HOUR);

            return isNightWindow ? 'night' : 'day';
        }

        function applyDisplayMode(now) {
            const mode = determineDisplayMode(now);
            document.body.classList.toggle('bedside-mode', mode === 'bedside');
            DOM.nightOverlay.style.opacity = mode === 'night' ? '1' : '0';

            if (mode === 'bedside') {
                DOM.btnToggleNight.textContent = '🔴 Bedside';
            } else if (mode === 'night') {
                DOM.btnToggleNight.textContent = '🌙 Night';
            } else {
                DOM.btnToggleNight.textContent = '☀️ Day';
            }
        }

        function formatCountdownText(diffMs) {
            const totalSecs = Math.max(0, Math.floor(diffMs / 1000));
            const hrs = Math.floor(totalSecs / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;

            if (hrs > 0) return `in ${hrs}h ${mins}m`;
            if (mins > 0) return `in ${mins}m ${String(secs).padStart(2, '0')}s`;
            return `in ${secs}s`;
        }

        function updateCandleCountdown(now) {
            const el = document.getElementById('candle-countdown-badge');
            if (!el || !state.candleLightingTimestamp) return;

            const diff = state.candleLightingTimestamp - now.getTime();
            const threeHoursMs = 3 * 60 * 60 * 1000;

            if (diff > 0 && diff <= threeHoursMs) {
                el.textContent = formatCountdownText(diff);
                el.classList.remove('hidden');
            } else if (diff <= 0 && diff > -15 * 60 * 1000) {
                el.textContent = 'Shabbat Shalom';
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function updateClock() {
            const now = new Date();
            const parts = timePartsFormatter.formatToParts(now);
            let timeStr = '';
            let ampmStr = '';

            for (const p of parts) {
                if (p.type === 'dayPeriod') {
                    ampmStr = p.value;
                } else if (p.type !== 'literal' || p.value === ':') {
                    timeStr += p.value;
                }
            }

            if (timeStr !== state.lastTimeString) {
                DOM.time.textContent = timeStr;
                DOM.ampm.textContent = ampmStr;
                state.lastTimeString = timeStr;
            }

            const monthStr = monthFormatter.format(now);
            const dayStr = dayFormatter.format(now);
            const dateKey = `${monthStr}-${dayStr}`;

            if (dateKey !== state.lastDateKey) {
                DOM.dateMonth.textContent = monthStr;
                DOM.dateDay.textContent = dayStr;
                state.lastDateKey = dateKey;
                if (state.hebcalItems.length) {
                    renderHebcalEvents(state.hebcalItems);
                }
            }

            applyDisplayMode(now);
            updateCandleCountdown(now);
        }

        function applyPixelShift() {
            if (!CONFIG.PIXEL_SHIFT.ENABLED) return;
            const max = CONFIG.PIXEL_SHIFT.MAX_OFFSET_PX;
            const dx = Math.floor(Math.random() * (max * 2 + 1)) - max;
            const dy = Math.floor(Math.random() * (max * 2 + 1)) - max;
            DOM.root.style.transform = `translate(${dx}px, ${dy}px)`;
        }

        /* ==========================================================================
           WALLPAPER CROSS-FADING
           ========================================================================== */
        function selectWeatherWallpaper() {
            let pool;
            if (!state.isDaytime && state.weatherCategory === 'clear') {
                pool = CONFIG.WEATHER_WALLPAPERS.night;
            } else {
                pool = CONFIG.WEATHER_WALLPAPERS[state.weatherCategory] || CONFIG.FALLBACK_WALLPAPERS;
            }

            const candidates = pool.filter(u => u !== state.currentWallpaperUrl);
            const chosen = (candidates.length ? candidates : pool)[
                Math.floor(Math.random() * (candidates.length || pool.length))
            ];
            crossfadeWallpaper(chosen);
        }

        function crossfadeWallpaper(url) {
            if (!url || url === state.currentWallpaperUrl) return;
            const img = new Image();
            img.onload = () => {
                state.currentWallpaperUrl = url;
                const nextLayer = state.activeBgLayer === 1 ? DOM.bg2 : DOM.bg1;
                const prevLayer = state.activeBgLayer === 1 ? DOM.bg1 : DOM.bg2;
                nextLayer.style.backgroundImage = `url('${url}')`;
                nextLayer.style.opacity = '1';
                prevLayer.style.opacity = '0';
                state.activeBgLayer = state.activeBgLayer === 1 ? 2 : 1;
            };
            img.onerror = () => {
                const fallback = CONFIG.FALLBACK_WALLPAPERS[0];
                if (url !== fallback) crossfadeWallpaper(fallback);
            };
            img.src = url;
        }

        /* ==========================================================================
           WEATHER, AIR QUALITY & SEVERE WEATHER / FROST ALERT
           ========================================================================== */
        function evaluateWeatherAlert(current, daily) {
            const temp = Number(current.temperature_2m);
            const gusts = Number(current.wind_gusts_10m || 0);
            const code = Number(current.weather_code);
            const aqi = Number(current.us_aqi || 0);
            const minToday = Array.isArray(daily?.temperature_2m_min) ? Number(daily.temperature_2m_min[0]) : temp;

            const isFahrenheit = CONFIG.TEMP_UNIT === 'fahrenheit';
            const freezeThresh = isFahrenheit ? 32 : 0;
            const frostThresh = isFahrenheit ? 36 : 2.5;
            const highWindThresh = isFahrenheit ? 35 : 56; // mph vs km/h

            if ([95, 96, 99].includes(code)) {
                return { icon: '⛈️', text: 'Thunderstorm Alert' };
            }
            if ([66, 67, 56, 57].includes(code)) {
                return { icon: '🧊', text: 'Freezing Rain / Ice Alert' };
            }
            if (temp <= freezeThresh || minToday <= freezeThresh) {
                return { icon: '❄️', text: `Freeze Warning (Low ${Math.round(minToday)}°)` };
            }
            if (temp <= frostThresh || minToday <= frostThresh) {
                return { icon: '🌡️', text: `Frost Advisory (Low ${Math.round(minToday)}°)` };
            }
            if (gusts >= highWindThresh) {
                const unitLabel = isFahrenheit ? 'mph' : 'km/h';
                return { icon: '💨', text: `High Wind Gusts (${Math.round(gusts)} ${unitLabel})` };
            }
            if (aqi >= 150) {
                return { icon: '😷', text: `Unhealthy Air Quality (AQI ${Math.round(aqi)})` };
            }
            return null;
        }

        function renderWeather(data) {
            if (!data || !data.current) return;
            const c = data.current;
            const d = data.daily || {};
            const info = WEATHER_CODES[c.weather_code] || { desc: 'Clear', icon: '🌤️', cat: 'clear' };

            state.weatherCategory = info.cat;
            state.isDaytime = c.is_day === 1;

            DOM.weatherIcon.textContent = (!state.isDaytime && c.weather_code <= 1) ? '🌙' : info.icon;
            DOM.weatherTemp.textContent = `${Math.round(c.temperature_2m)}°`;
            DOM.weatherDesc.textContent = info.desc;

            DOM.pillFeels.textContent = `Feels ${Math.round(c.apparent_temperature)}°`;

            const precipProb = Array.isArray(d.precipitation_probability_max) ? d.precipitation_probability_max[0] : 0;
            DOM.pillRain.textContent = `💧 ${precipProb ?? 0}%`;

            const uv = typeof c.uv_index === 'number' ? Math.round(c.uv_index) : '--';
            DOM.pillUv.textContent = `☀️ UV ${uv}`;

            const aqi = typeof c.us_aqi === 'number' ? Math.round(c.us_aqi) : '--';
            DOM.pillAqi.textContent = `🍃 AQI ${aqi}`;

            if (Array.isArray(d.sunrise) && Array.isArray(d.sunset) && d.sunrise[0] && d.sunset[0]) {
                const targetIso = state.isDaytime ? d.sunset[0] : d.sunrise[0];
                const sunEmoji = state.isDaytime ? '🌇' : '🌅';
                const formattedSun = shortTimeFormatter.format(new Date(targetIso));
                DOM.pillSun.textContent = `${sunEmoji} ${formattedSun}`;
            }

            const alertInfo = evaluateWeatherAlert(c, d);
            if (alertInfo) {
                DOM.weatherAlertIcon.textContent = alertInfo.icon;
                DOM.weatherAlertText.textContent = alertInfo.text;
                DOM.weatherAlertPill.classList.remove('hidden');
            } else {
                DOM.weatherAlertPill.classList.add('hidden');
            }

            selectWeatherWallpaper();
        }

        async function fetchWeather() {
            const { LAT, LON } = CONFIG.LOCATION;
            const windUnit = CONFIG.TEMP_UNIT === 'fahrenheit' ? 'mph' : 'kmh';
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,is_day,weather_code,uv_index,wind_gusts_10m&daily=sunrise,sunset,precipitation_probability_max,temperature_2m_min&temperature_unit=${CONFIG.TEMP_UNIT}&wind_speed_unit=${windUnit}&timezone=${encodeURIComponent(CONFIG.TIMEZONE)}&forecast_days=2`;
            const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi&timezone=${encodeURIComponent(CONFIG.TIMEZONE)}`;

            try {
                const [weatherData, aqiData] = await Promise.all([
                    fetchWithTimeout(weatherUrl),
                    fetchWithTimeout(aqiUrl).catch(() => null)
                ]);

                if (aqiData?.current && typeof aqiData.current.us_aqi === 'number') {
                    weatherData.current.us_aqi = aqiData.current.us_aqi;
                }

                renderWeather(weatherData);
                writeCache({ weather: weatherData, weatherTs: Date.now() });
            } catch {
                const cached = readCache().weather;
                if (cached) renderWeather(cached);
            }
        }

        /* ==========================================================================
           HEBCAL SHABBAT & HOLIDAY SCHEDULE (NEXT 36 HOURS ONLY)
           ========================================================================== */
        function parseEventStartTimestamp(item) {
            if (!item || !item.date) return null;
            if (item.date.includes('T')) {
                const ts = Date.parse(item.date);
                return Number.isNaN(ts) ? null : ts;
            }
            // All-day date (YYYY-MM-DD): treat start of day in local/configured context
            const [y, m, d] = item.date.split('-').map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d, 0, 0, 0).getTime();
        }

        function isEventWithin36Hours(item, nowMs) {
            const startMs = parseEventStartTimestamp(item);
            if (!startMs) return false;

            const windowMs = 36 * 60 * 60 * 1000;
            if (item.date.includes('T')) {
                // Timed event: show from 30 mins ago up to 36 hours ahead
                return startMs >= (nowMs - 30 * 60 * 1000) && startMs <= (nowMs + windowMs);
            }
            // All-day event: show if today (end of day >= now) or starts within 36 hours
            const endOfDayMs = startMs + 24 * 60 * 60 * 1000;
            return endOfDayMs >= nowMs && startMs <= (nowMs + windowMs);
        }

        function getHebcalIcon(category) {
            switch (category) {
                case 'candles': return '🕯️';
                case 'havdalah': return '✨';
                case 'parashat': return '📖';
                case 'holiday': return '✡️';
                case 'roshchodesh': return '🌒';
                case 'omer': return '🌾';
                default: return '📅';
            }
        }

        function renderHebcalEvents(items) {
            state.hebcalItems = Array.isArray(items) ? items : [];

            if (!CONFIG.HEBCAL.ENABLED) {
                DOM.hebcalCard.classList.add('hidden');
                return;
            }

            const now = new Date();
            const nowMs = now.getTime();
            const filtered = state.hebcalItems
                .filter(item => isEventWithin36Hours(item, nowMs))
                .slice(0, CONFIG.HEBCAL.MAX_ITEMS);

            if (!filtered.length) {
                DOM.hebcalCard.classList.add('hidden');
                state.candleLightingTimestamp = null;
                return;
            }

            DOM.hebcalCard.classList.remove('hidden');
            state.candleLightingTimestamp = null;
            DOM.hebcalEventsList.innerHTML = '';

            filtered.forEach(item => {
                const isCandles = item.category === 'candles';
                const eventTs = parseEventStartTimestamp(item);
                const isImminentCandles = isCandles && eventTs && (eventTs - nowMs) > -15 * 60 * 1000 && (eventTs - nowMs) <= 3 * 60 * 60 * 1000;

                if (isCandles && eventTs && !state.candleLightingTimestamp) {
                    state.candleLightingTimestamp = eventTs;
                }

                const card = document.createElement('div');
                card.className = isImminentCandles
                    ? 'glass-panel rounded-[clamp(0.75rem,1.75vh,1.15rem)] px-[clamp(0.65rem,1.15vw,1.15rem)] py-[clamp(0.45rem,1.15vh,0.85rem)] border-amber-300/60 bg-amber-500/15 shadow-lg transition'
                    : 'glass-panel rounded-[clamp(0.75rem,1.75vh,1.15rem)] px-[clamp(0.65rem,1.15vw,1.15rem)] py-[clamp(0.45rem,1.15vh,0.85rem)] transition';

                const dateObj = item.date.includes('T')
                    ? new Date(item.date)
                    : new Date(`${item.date}T12:00:00`);
                const dayLabel = hebcalDayFormatter.format(dateObj);
                const timeLabel = item.date.includes('T') ? ` • ${shortTimeFormatter.format(dateObj)}` : '';

                const titleRow = document.createElement('div');
                titleRow.className = 'flex items-center justify-between gap-2 font-semibold leading-snug';

                const leftTitle = document.createElement('span');
                leftTitle.className = 'truncate';
                leftTitle.textContent = `${getHebcalIcon(item.category)} ${item.title}`;
                titleRow.appendChild(leftTitle);

                if (isCandles) {
                    const badge = document.createElement('span');
                    badge.id = 'candle-countdown-badge';
                    badge.className = 'hidden shrink-0 px-2 py-0.5 rounded-full bg-amber-400/25 border border-amber-300/50 text-amber-200 text-[0.7em] font-bold tabular-nums';
                    titleRow.appendChild(badge);
                }

                const subRow = document.createElement('div');
                subRow.className = 'text-[0.82em] text-amber-200/85 mt-0.5 truncate';
                subRow.textContent = `${dayLabel}${timeLabel}`;

                card.appendChild(titleRow);
                card.appendChild(subRow);
                DOM.hebcalEventsList.appendChild(card);
            });

            updateCandleCountdown(now);
        }

        async function fetchHebcal() {
            if (!CONFIG.HEBCAL.ENABLED) {
                DOM.hebcalCard.classList.add('hidden');
                return;
            }

            const { LAT, LON } = CONFIG.LOCATION;
            const { CANDLE_LIGHTING_MINS, HAVDALAH_MINS, ISRAEL } = CONFIG.HEBCAL;
            const cacheKey = `${LAT.toFixed(3)}_${LON.toFixed(3)}_${CANDLE_LIGHTING_MINS}_${HAVDALAH_MINS}_${ISRAEL}`;
            const url = `https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&mod=on&nx=on&ss=on&mf=on&c=on&s=on&geo=pos&latitude=${LAT}&longitude=${LON}&tzid=${encodeURIComponent(CONFIG.TIMEZONE)}&b=${CANDLE_LIGHTING_MINS}&M=on&m=${HAVDALAH_MINS}&i=${ISRAEL ? 'on' : 'off'}`;

            try {
                const data = await fetchWithTimeout(url);
                const items = Array.isArray(data?.items) ? data.items : [];
                renderHebcalEvents(items);
                writeCache({ hebcal: items, hebcalKey: cacheKey, hebcalTs: Date.now() });
            } catch {
                const cache = readCache();
                if (cache.hebcal && cache.hebcalKey === cacheKey) {
                    renderHebcalEvents(cache.hebcal);
                } else {
                    DOM.hebcalCard.classList.add('hidden');
                }
            }
        }

        /* ==========================================================================
           iOS 26 CONTROL CENTER TIMER SLIDER & COUNTDOWN
           ========================================================================== */
        function updateTimerSliderUI(mins) {
            const clamped = Math.max(1, Math.min(60, Math.round(mins)));
            state.selectedTimerMins = clamped;
            DOM.iosTimerFill.style.height = `${(clamped / 60) * 100}%`;
            DOM.iosTimerValue.textContent = String(clamped);
            DOM.iosTimerTrack.setAttribute('aria-valuenow', String(clamped));
            DOM.btnIosTimerStart.textContent = `Start ${clamped}m`;
        }

        function setSliderFromClientY(clientY) {
            const rect = DOM.iosTimerTrack.getBoundingClientRect();
            const ratio = 1 - ((clientY - rect.top) / rect.height);
            const rawMins = Math.round(ratio * 60);
            updateTimerSliderUI(rawMins);
        }

        function toggleTimerPopover() {
            const isNowHidden = DOM.iosTimerPopover.classList.toggle('hidden');
            document.body.classList.toggle('timer-picker-open', !isNowHidden);
        }

        function closeTimerPopover() {
            DOM.iosTimerPopover.classList.add('hidden');
            document.body.classList.remove('timer-picker-open');
        }

        async function playTimerChime() {
            try {
                await Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.02, decay: 0.4, sustain: 0.1, release: 1.4 }
                }).toDestination();
                synth.volume.value = CONFIG.SOUND.CHIME_VOLUME_DB;

                const now = Tone.now();
                synth.triggerAttackRelease('C5', '8n', now);
                synth.triggerAttackRelease('E5', '8n', now + 0.18);
                synth.triggerAttackRelease('G5', '8n', now + 0.36);
                synth.triggerAttackRelease('C6', '2n', now + 0.54);

                setTimeout(() => synth.dispose(), 3500);
            } catch {
                // Audio context blocked
            }
        }

        function stopTimer() {
            if (state.timerIntervalId) {
                clearInterval(state.timerIntervalId);
                state.timerIntervalId = null;
            }
            state.timerEndTimestamp = null;
            state.timerTotalMs = 0;
            DOM.topTimerPill.classList.add('hidden');
        }

        function updateTimerDisplay() {
            if (!state.timerEndTimestamp) return;
            const remainingMs = state.timerEndTimestamp - Date.now();

            if (remainingMs <= 0) {
                stopTimer();
                playTimerChime();
                return;
            }

            if (DOM.topTimerRing && state.timerTotalMs > 0) {
                const circumference = 94.25;
                const progress = Math.max(0, Math.min(1, remainingMs / state.timerTotalMs));
                DOM.topTimerRing.style.strokeDashoffset = String(circumference * (1 - progress));
            }

            const totalSecs = Math.ceil(remainingMs / 1000);
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            DOM.topTimerCountdown.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function startTimer(minutes) {
            stopTimer();
            closeTimerPopover();
            state.timerTotalMs = minutes * 60 * 1000;
            state.timerEndTimestamp = Date.now() + state.timerTotalMs;
            if (DOM.topTimerRing) {
                DOM.topTimerRing.style.strokeDashoffset = '0';
            }
            DOM.topTimerPill.classList.remove('hidden');
            updateTimerDisplay();
            state.timerIntervalId = setInterval(updateTimerDisplay, 250);
        }

        /* ==========================================================================
           AMBIENT SOUNDSCAPES (WHITE, FAN, BROWN, RAIN, SINGING BOWLS)
           ========================================================================== */
        function stopAmbientSound() {
            if (state.ambientNodes) {
                try {
                    state.ambientNodes.dispose();
                } catch {
                    // Ignore disposal errors
                }
                state.ambientNodes = null;
            }
        }

        function updateSoundButtonStyles() {
            DOM.soundBtns.forEach(btn => {
                const isActive = btn.dataset.sound === state.ambientMode;
                btn.classList.toggle('bg-amber-400/30', isActive);
                btn.classList.toggle('ring-1', isActive);
                btn.classList.toggle('ring-amber-300/70', isActive);
                btn.classList.toggle('text-amber-100', isActive);
                btn.classList.toggle('bg-white/10', !isActive);
            });
        }

        async function toggleAmbientSound(mode) {
            const nextMode = state.ambientMode === mode ? 'off' : mode;
            stopAmbientSound();
            state.ambientMode = nextMode;
            updateSoundButtonStyles();

            if (nextMode === 'off') return;

            try {
                await Tone.start();

                if (nextMode === 'white') {
                    const whiteNoise = new Tone.Noise('white');
                    const filter = new Tone.Filter({ type: 'lowpass', frequency: 1400, rolloff: -12 }).toDestination();
                    whiteNoise.volume.value = CONFIG.SOUND.VOLUME_DB - 2;
                    whiteNoise.connect(filter);
                    whiteNoise.start();

                    state.ambientNodes = {
                        dispose: () => {
                            whiteNoise.stop();
                            whiteNoise.dispose();
                            filter.dispose();
                        }
                    };
                } else if (nextMode === 'fan') {
                    const fanNoise = new Tone.Noise('pink');
                    const lowpass = new Tone.Filter({ type: 'lowpass', frequency: 240, rolloff: -24 }).toDestination();
                    const lfo = new Tone.LFO({ frequency: 0.14, min: 185, max: 285 }).start();
                    lfo.connect(lowpass.frequency);

                    fanNoise.volume.value = CONFIG.SOUND.VOLUME_DB + 2;
                    fanNoise.connect(lowpass);
                    fanNoise.start();

                    state.ambientNodes = {
                        dispose: () => {
                            fanNoise.stop();
                            fanNoise.dispose();
                            lfo.stop();
                            lfo.dispose();
                            lowpass.dispose();
                        }
                    };
                } else if (nextMode === 'brown') {
                    const brownNoise = new Tone.Noise('brown');
                    const filter = new Tone.Filter({ type: 'lowpass', frequency: 420, rolloff: -12 }).toDestination();
                    brownNoise.volume.value = CONFIG.SOUND.VOLUME_DB + 3;
                    brownNoise.connect(filter);
                    brownNoise.start();

                    state.ambientNodes = {
                        dispose: () => {
                            brownNoise.stop();
                            brownNoise.dispose();
                            filter.dispose();
                        }
                    };
                } else if (nextMode === 'rain') {
                    const mistNoise = new Tone.Noise('pink');
                    const mistFilter = new Tone.Filter({ type: 'bandpass', frequency: 1650, Q: 0.65 }).toDestination();
                    mistNoise.volume.value = CONFIG.SOUND.VOLUME_DB - 3;
                    mistNoise.connect(mistFilter);
                    mistNoise.start();

                    const bodyNoise = new Tone.Noise('brown');
                    const bodyFilter = new Tone.Filter({ type: 'lowpass', frequency: 520, rolloff: -12 }).toDestination();
                    bodyNoise.volume.value = CONFIG.SOUND.VOLUME_DB - 1;
                    bodyNoise.connect(bodyFilter);
                    bodyNoise.start();

                    const dropReverb = new Tone.Reverb({ decay: 1.8, wet: 0.45 }).toDestination();
                    const dropSynth = new Tone.MembraneSynth({
                        pitchDecay: 0.015,
                        octaves: 2.5,
                        envelope: { attack: 0.002, decay: 0.09, sustain: 0, release: 0.08 }
                    }).connect(dropReverb);
                    dropSynth.volume.value = CONFIG.SOUND.VOLUME_DB - 14;

                    const dropNotes = ['G5', 'A5', 'C6', 'D6', 'E6', 'G6'];
                    const dropInterval = setInterval(() => {
                        if (Math.random() > 0.32) {
                            const note = dropNotes[Math.floor(Math.random() * dropNotes.length)];
                            dropSynth.triggerAttackRelease(note, '32n');
                        }
                    }, 260);

                    state.ambientNodes = {
                        dispose: () => {
                            clearInterval(dropInterval);
                            mistNoise.stop();
                            mistNoise.dispose();
                            mistFilter.dispose();
                            bodyNoise.stop();
                            bodyNoise.dispose();
                            bodyFilter.dispose();
                            dropSynth.dispose();
                            dropReverb.dispose();
                        }
                    };
                } else if (nextMode === 'bowl') {
                    const reverb = new Tone.Reverb({ decay: 6.5, wet: 0.65 }).toDestination();
                    const bowlSynth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'sine' },
                        envelope: { attack: 1.4, decay: 2.5, sustain: 0.35, release: 5.5 }
                    }).connect(reverb);
                    bowlSynth.volume.value = CONFIG.SOUND.VOLUME_DB - 4;

                    const bowlFrequencies = [216, 256, 288, 324, 384, 432, 512, 648, 864];
                    let lastFreq = 0;

                    const strikeBowl = () => {
                        const choices = bowlFrequencies.filter(f => f !== lastFreq);
                        const fundamental = choices[Math.floor(Math.random() * choices.length)];
                        lastFreq = fundamental;
                        bowlSynth.triggerAttackRelease([fundamental, fundamental * 2.756], 3.2);
                    };

                    strikeBowl();
                    const bowlInterval = setInterval(strikeBowl, 4800);

                    state.ambientNodes = {
                        dispose: () => {
                            clearInterval(bowlInterval);
                            bowlSynth.releaseAll();
                            bowlSynth.dispose();
                            reverb.dispose();
                        }
                    };
                }
            } catch {
                state.ambientMode = 'off';
                updateSoundButtonStyles();
            }
        }

        /* ==========================================================================
           TOUCH & INTERACTION CONTROLS
           ========================================================================== */
        function initControls() {
            // Timer Popover Toggle & iOS Capsule Slider Drag
            DOM.btnOpenTimer.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleTimerPopover();
            });

            let isDraggingSlider = false;
            DOM.iosTimerTrack.addEventListener('pointerdown', (e) => {
                isDraggingSlider = true;
                DOM.iosTimerTrack.setPointerCapture(e.pointerId);
                setSliderFromClientY(e.clientY);
            });

            DOM.iosTimerTrack.addEventListener('pointermove', (e) => {
                if (!isDraggingSlider) return;
                setSliderFromClientY(e.clientY);
            });

            const endSliderDrag = (e) => {
                if (!isDraggingSlider) return;
                isDraggingSlider = false;
                if (DOM.iosTimerTrack.hasPointerCapture(e.pointerId)) {
                    DOM.iosTimerTrack.releasePointerCapture(e.pointerId);
                }
            };

            DOM.iosTimerTrack.addEventListener('pointerup', endSliderDrag);
            DOM.iosTimerTrack.addEventListener('pointercancel', endSliderDrag);

            DOM.iosTimerTrack.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    updateTimerSliderUI(state.selectedTimerMins + 1);
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    updateTimerSliderUI(state.selectedTimerMins - 1);
                } else if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    startTimer(state.selectedTimerMins);
                }
            });

            DOM.btnIosTimerStart.addEventListener('click', () => {
                startTimer(state.selectedTimerMins);
            });

            DOM.btnTopCancelTimer.addEventListener('click', stopTimer);

            // Dismiss timer popover when tapping outside
            document.addEventListener('pointerdown', (e) => {
                if (DOM.iosTimerPopover.classList.contains('hidden')) return;
                if (e.target.closest('#ios-timer-popover') || e.target.closest('#btn-open-timer')) return;
                closeTimerPopover();
            });

            // Sound buttons
            DOM.soundBtns.forEach(btn => {
                btn.addEventListener('click', () => toggleAmbientSound(btn.dataset.sound));
            });

            // Day / Night / Bedside Mode Toggle
            DOM.btnToggleNight.addEventListener('click', () => {
                const current = determineDisplayMode(new Date());
                if (current === 'day') {
                    state.nightModeOverride = 'night';
                } else if (current === 'night') {
                    state.nightModeOverride = 'bedside';
                } else {
                    state.nightModeOverride = 'day';
                }
                applyDisplayMode(new Date());
            });

            // Blackout Screen Toggle
            DOM.btnBlackout.addEventListener('click', () => {
                state.isBlackout = true;
                closeTimerPopover();
                DOM.blackoutOverlay.classList.remove('hidden');
            });

            DOM.blackoutOverlay.addEventListener('click', () => {
                state.isBlackout = false;
                DOM.blackoutOverlay.classList.add('hidden');
            });

            // Manual Refresh Button
            DOM.btnRefresh.addEventListener('click', () => {
                DOM.refreshIcon.style.transform = 'rotate(360deg)';
                setTimeout(() => {
                    DOM.refreshIcon.style.transform = 'rotate(0deg)';
                }, 550);
                fetchWeather();
                fetchHebcal();
            });
        }

        /* ==========================================================================
           INITIALIZATION
           ========================================================================== */
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        window.onload = function () {
            updateNetworkStatus();
            initControls();
            updateTimerSliderUI(state.selectedTimerMins);

            // Hydrate cached data immediately for instant startup
            const cached = readCache();
            if (cached.weather) renderWeather(cached.weather);
            if (cached.hebcal) renderHebcalEvents(cached.hebcal);
            if (!state.currentWallpaperUrl) {
                crossfadeWallpaper(CONFIG.FALLBACK_WALLPAPERS[0]);
            }

            // Start live clock & background data polling
            updateClock();
            setInterval(updateClock, CONFIG.CLOCK_INTERVAL_MS);

            fetchWeather();
            setInterval(fetchWeather, CONFIG.WEATHER_INTERVAL_MS);

            fetchHebcal();
            setInterval(fetchHebcal, 30 * 60 * 1000);

            setInterval(applyPixelShift, CONFIG.PIXEL_SHIFT.INTERVAL_MS);
        };
    </script>
</body>
