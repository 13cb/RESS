<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Show Dashboard</title>
    
    <!-- Tailwind CSS for responsive layout & styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tone.js for gentle kitchen timer chimes & synthesized ambient soundscapes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        /* @import placed first per CSS specification, paired with native system fallback stack */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');

        :root {
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            --night-brightness: 1;
            --night-sepia: 0;
        }

        body {
            font-family: var(--font-primary);
            filter: brightness(var(--night-brightness)) sepia(var(--night-sepia));
            transition: filter 1.5s ease-in-out;
        }

        /* Custom text shadow for extreme legibility over variable background photography */
        .text-shadow-heavy {
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 0, 0, 0.65);
        }

        /* Cross-fading background layers for flicker-free wallpaper transitions */
        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1.2s ease-in-out;
            will-change: opacity;
        }

        /* Pixel-shift container for OLED/LCD burn-in prevention */
        #burn-in-shifter {
            transition: transform 2s ease-in-out;
            will-change: transform;
        }

        /* Night mode helper: hides non-essential clutter during sleep hours */
        body.is-night-mode .night-hide {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 1s ease;
        }

        /* Respect OS reduced-motion preferences */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-white bg-neutral-950 select-none">

    <!-- Dual Background Layers for Preloaded Cross-Fade Transitions -->
    <div id="bg-layer-1" class="bg-layer opacity-100 z-0" aria-hidden="true"></div>
    <div id="bg-layer-2" class="bg-layer opacity-0 z-0" aria-hidden="true"></div>

    <!-- Translucent Gradient Overlay for Legibility -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/45 via-black/15 to-black/75 z-10 pointer-events-none" aria-hidden="true"></div>

    <!-- Double-Tap Pure Blackout / Sleep Screen Overlay -->
    <div id="blackout-overlay" class="fixed inset-0 bg-black z-50 hidden flex flex-col items-center justify-center cursor-pointer" aria-label="Screen blacked out. Tap to wake.">
        <span class="text-white/15 text-xs tracking-widest uppercase select-none">Tap screen to wake</span>
    </div>

    <!-- Pixel-Shift Wrapper (Moves slightly every 15 mins to prevent screen burn-in) -->
    <div id="burn-in-shifter" class="relative z-20 h-full w-full">

        <!-- Main Dashboard Container -->
        <main class="flex flex-col justify-between h-full w-full p-5 sm:p-8 md:p-12 lg:p-16">
            
            <!-- TOP ROW: Active Timer Pill (Left) & Current Weather + Environment Pills (Right) -->
            <header class="flex flex-col sm:flex-row justify-between items-start gap-4 w-full">
                
                <!-- Top-Left: Active Kitchen / Focus Timer Pill (Hidden until a timer is started) -->
                <div class="flex flex-col gap-2">
                    <div id="active-timer-card" aria-live="polite" class="hidden flex items-center gap-3 bg-amber-500/25 backdrop-blur-md border border-amber-400/40 rounded-2xl px-4 py-2.5 shadow-xl">
                        <span class="text-2xl animate-pulse" aria-hidden="true">⏲️</span>
                        <div>
                            <div class="text-[10px] uppercase tracking-wider text-amber-200 font-bold">Active Timer</div>
                            <div id="timer-display" class="text-2xl sm:text-3xl font-black tracking-tight text-white tabular-nums">00:00</div>
                        </div>
                        <button id="cancel-timer-btn" type="button" class="ml-2 bg-black/40 hover:bg-black/60 active:scale-95 text-white/90 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition">
                            Cancel
                        </button>
                    </div>
                </div>

                <!-- Top-Right: Current Weather, Environmental Pills & Next-Hour Rain Timeline -->
                <section id="weather-section" aria-label="Current Weather" aria-live="polite" class="self-end text-right text-shadow-heavy ml-auto max-w-full">
                    <div class="flex items-center justify-end gap-2 sm:gap-3">
                        <span id="weather-icon" class="text-[clamp(2rem,5vw,3.5rem)]" aria-hidden="true">🌡️</span>
                        <div id="weather-temp" class="text-[clamp(2.75rem,7vw,4.75rem)] font-bold tracking-tighter leading-none">--°</div>
                    </div>
                    <div id="weather-desc" class="text-[clamp(1rem,2.8vw,1.75rem)] font-medium mt-1">Loading weather...</div>
                    
                    <!-- Actionable Environmental Pills: Feels Like, Rain %, UV, AQI, Sun & Moon -->
                    <div class="night-hide flex flex-wrap items-center justify-end gap-1.5 mt-2">
                        <span id="pill-feels" class="bg-black/40 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-0.5 text-xs font-medium text-gray-100">Feels --°</span>
                        <span id="pill-rain" class="bg-black/40 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-0.5 text-xs font-medium text-sky-200">💧 --%</span>
                        <span id="pill-uv" class="bg-black/40 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-0.5 text-xs font-medium text-amber-200">☀️ UV --</span>
                        <span id="pill-aqi" class="bg-black/40 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-0.5 text-xs font-medium text-emerald-200">🍃 AQI --</span>
                        <span id="pill-sun" class="bg-black/40 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-0.5 text-xs font-medium text-orange-200">🌅 --</span>
                        <span id="pill-moon" class="bg-black/40 backdrop-blur-md border border-white/15 rounded-full px-2.5 py-0.5 text-xs font-medium text-indigo-200">🌕 --</span>
                    </div>

                    <!-- Next-Hour Rain Timeline (Automatically appears when precipitation is expected in the next 60 mins) -->
                    <div id="next-hour-rain-box" class="night-hide hidden mt-2.5 ml-auto bg-sky-950/60 backdrop-blur-md border border-sky-400/30 rounded-xl px-3 py-2 text-left max-w-[260px] shadow-lg">
                        <div class="flex items-center justify-between text-[11px] font-bold text-sky-200 uppercase tracking-wider mb-1.5">
                            <span>🌧️ Next Hour Rain</span>
                            <span id="rain-timeline-summary" class="text-white">Soon</span>
                        </div>
                        <div id="rain-timeline-bars" class="grid grid-cols-4 gap-1.5 items-end h-8">
                            <!-- 15-min interval bars injected via JS -->
                        </div>
                    </div>

                    <!-- Network Status / Cached Indicators -->
                    <div class="flex items-center justify-end gap-2 mt-1.5 text-[clamp(0.75rem,2vw,1.1rem)] text-gray-200 opacity-85 font-light tracking-wide uppercase">
                        <span id="network-offline-pill" class="hidden inline-flex items-center gap-1 bg-rose-500/30 border border-rose-400/50 text-rose-200 text-[10px] font-bold px-2 py-0.5 rounded-full">
                            <span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-ping"></span> Offline
                        </span>
                        <span id="offline-indicator" class="hidden text-amber-400 font-bold" title="Cached data">(Cached)</span>
                    </div>
                </section>
            </header>

            <!-- BOTTOM ROW: Clock, Event Countdown & Israel World Clock -->
            <footer class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 md:gap-8 mt-auto text-shadow-heavy w-full">
                
                <!-- Clock, Countdown Badge, Israel World Clock Pill, and Date Section -->
                <section id="clock-section" aria-label="Current Time and Date" aria-live="polite" class="flex-shrink-0">
                    <!-- Event Countdown & Secondary World Clock Row -->
                    <div class="flex flex-wrap items-center gap-2 mb-2 pl-1">
                        <div id="event-countdown-pill" class="night-hide hidden inline-flex items-center gap-1.5 bg-white/15 backdrop-blur-md border border-white/20 rounded-full px-3 py-1 text-xs sm:text-sm font-medium text-white shadow-md">
                            <span id="event-icon" aria-hidden="true">🎉</span>
                            <span id="event-text">Countdown</span>
                        </div>
                        <div id="world-clock-pill" class="night-hide hidden inline-flex items-center gap-1.5 bg-black/40 backdrop-blur-md border border-white/15 rounded-full px-3 py-1 text-xs sm:text-sm font-medium text-gray-100 shadow-md">
                            <span id="world-clock-flag" aria-hidden="true">🇮🇱</span>
                            <span id="world-clock-time" class="font-bold text-white tabular-nums">--:--</span>
                        </div>
                    </div>

                    <div class="flex items-baseline gap-2 md:gap-4 flex-wrap">
                        <time id="time" class="text-[clamp(4.5rem,17vw,12rem)] font-black leading-none tracking-tight">--:--</time>
                        <span id="ampm" class="text-[clamp(1.5rem,4.5vw,3.5rem)] font-bold opacity-90">--</span>
                    </div>
                    <div id="date" class="text-[clamp(1.25rem,3.5vw,2.5rem)] font-medium mt-1 md:mt-2 text-gray-100 pl-1 md:pl-2 opacity-90">---</div>
                </section>

            </footer>
        </main>
    </div>

    <!-- Tap-to-Toggle Floating Touch Control Bar (Auto-hides after inactivity) -->
    <aside id="touch-control-bar" aria-label="Quick Dashboard Controls" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 opacity-0 pointer-events-none translate-y-4 transition-all duration-300 w-[95%] max-w-4xl">
        <div class="bg-neutral-900/90 backdrop-blur-xl border border-white/20 rounded-2xl p-2.5 sm:p-3 shadow-2xl flex flex-wrap items-center justify-center gap-2">
            
            <!-- Quick Kitchen Timers -->
            <div class="flex items-center gap-1 bg-white/10 rounded-xl p-1">
                <span class="text-xs font-semibold text-gray-300 px-1.5">⏲️ Timer:</span>
                <button type="button" data-timer="5" class="timer-preset-btn px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-bold transition">5m</button>
                <button type="button" data-timer="10" class="timer-preset-btn px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-bold transition">10m</button>
                <button type="button" data-timer="15" class="timer-preset-btn px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-bold transition">15m</button>
                <button type="button" data-timer="30" class="timer-preset-btn px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-bold transition">30m</button>
            </div>

            <!-- Ambient Soundscape Generator (Tone.js) -->
            <button id="btn-toggle-sound" type="button" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-semibold transition flex items-center gap-1.5">
                🎧 <span id="sound-status-label">Sound: Off</span>
            </button>

            <!-- Switch Saved Location -->
            <button id="btn-switch-location" type="button" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-semibold transition flex items-center gap-1.5">
                📍 <span id="btn-location-label">Switch City</span>
            </button>

            <!-- Toggle 12h / 24h Format -->
            <button id="btn-toggle-24h" type="button" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-semibold transition">
                🕒 12h / 24h
            </button>

            <!-- Cycle Wallpaper -->
            <button id="btn-cycle-bg" type="button" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-semibold transition">
                🖼️ Wallpaper
            </button>

            <!-- Toggle Night Mode Override -->
            <button id="btn-toggle-night" type="button" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-semibold transition">
                🌙 Night Mode
            </button>

            <!-- Blackout / Sleep Screen -->
            <button id="btn-blackout" type="button" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 text-xs font-semibold transition">
                ⬛ Screen Off
            </button>

            <!-- Force Weather Refresh -->
            <button id="btn-refresh-weather" type="button" class="px-3 py-2 rounded-xl bg-sky-500/30 hover:bg-sky-500/50 border border-sky-400/30 active:scale-95 text-xs font-semibold transition">
                🔄 Refresh
            </button>
        </div>
    </aside>

    <script>
        /* ==========================================================================
           MASTER CONFIGURATION (Edit any setting below to customize your dashboard)
           ========================================================================== */
        const CONFIG = {
            // 1. Saved Locations (Tap "Switch City" in the touch bar to cycle through these)
            LOCATIONS: [
                { NAME: 'Teaneck, NJ', LAT: 40.8976, LON: -74.0154 },
                { NAME: 'New York, NY', LAT: 40.7128, LON: -74.0060 },
                { NAME: 'Jerusalem', LAT: 31.7683, LON: 35.2137 }
            ],
            DEFAULT_LOCATION_INDEX: 0,

            // 2. Weather & Units
            TEMP_UNIT: 'fahrenheit',          // 'fahrenheit' or 'celsius'
            SHOW_NEXT_HOUR_RAIN: true,        // Pops up a 60-min rain bar when precipitation is approaching

            // 3. Clock, Locale & World Clock
            LOCALE: 'en-US',
            TIMEZONE: undefined,              // undefined = device local timezone
            USE_24_HOUR: false,               // true for 24-hour clock (14:30), false for 12-hour (2:30 PM)
            WORLD_CLOCK: {
                ENABLED: true,
                FLAG: '🇮🇱',
                TIMEZONE: 'Asia/Jerusalem'
            },

            // 4. Refresh & Network Timing (Milliseconds)
            CLOCK_INTERVAL_MS: 1000,          // Clock tick frequency (1 second)
            WEATHER_INTERVAL_MS: 600000,      // Weather API refresh (10 minutes)
            FETCH_TIMEOUT_MS: 8000,           // Abort API requests if slower than 8 seconds
            CACHE_TTL_MS: 3600000,            // Keep cached weather valid for up to 1 hour offline
            STORAGE_KEY: 'echo_dashboard_v5',

            // 5. Auto Night Mode / Bedside Dimming Schedule
            NIGHT_MODE: {
                ENABLED: true,
                START_HOUR: 22,               // 10:00 PM (24-hour format: 0-23)
                END_HOUR: 6,                  // 6:00 AM (24-hour format: 0-23)
                BRIGHTNESS: 0.30,             // Screen brightness during night hours (0.1 to 1.0)
                WARM_TINT: 0.35,              // Warm sepia filter to reduce blue light (0.0 to 1.0)
                HIDE_EXTRA_WIDGETS: true      // Hides pills at night for a clean bedside clock
            },

            // 6. Display Hardware Protection (Burn-in Prevention & Wake Lock)
            PIXEL_SHIFT: {
                ENABLED: true,
                INTERVAL_MS: 900000,          // Shift position every 15 minutes
                MAX_OFFSET_PX: 4              // Subtle 1-4px drift to protect LCD/OLED pixels
            },
            KEEP_SCREEN_AWAKE: true,          // Uses Screen Wake Lock API when supported

            // 7. Holiday & Event Countdowns
            EVENTS: [
                { NAME: "New Year's Day", MONTH: 1, DAY: 1, ICON: "🎆" },
                { NAME: "Independence Day", MONTH: 7, DAY: 4, ICON: "🇺🇸" },
                { NAME: "Halloween", MONTH: 10, DAY: 31, ICON: "🎃" },
                { NAME: "Thanksgiving", MONTH: 11, DAY: 26, ICON: "🦃" },
                { NAME: "Christmas", MONTH: 12, DAY: 25, ICON: "🎄" }
            ],

            // 8. Tap-to-Reveal Touch Control Bar & Kitchen Timers
            CONTROLS: {
                AUTO_HIDE_MS: 8000,
                TIMER_PRESETS_MIN: [5, 10, 15, 30],
                SOUND_PRESETS: ['Off', 'Brown Noise', 'Soft Rain', 'White Noise']
            },

            // 9. Dynamic Weather & Time-of-Day Wallpapers
            BACKGROUNDS: {
                THUNDERSTORM: 'https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28?auto=format&fit=crop&w=1920&q=80',
                RAIN:         'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1920&q=80',
                SNOW:         'https://images.unsplash.com/photo-1478265409131-1f65c88f965c?auto=format&fit=crop&w=1920&q=80',
                FOG:          'https://images.unsplash.com/photo-1487621167305-5d248087c724?auto=format&fit=crop&w=1920&q=80',
                CLOUDY_DAY:   'https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1920&q=80',
                NIGHT_CLEAR:  'https://images.unsplash.com/photo-1507400492013-162706c8c05e?auto=format&fit=crop&w=1920&q=80',
                DAY_CLEAR:    'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80'
            }
        };

        /* ==========================================================================
           APPLICATION STATE & DOM CACHE
           ========================================================================== */
        const state = {
            locationIndex: CONFIG.DEFAULT_LOCATION_INDEX,
            use24Hour: CONFIG.USE_24_HOUR,
            nightModeOverride: null,          // null = auto schedule, true/false = manual override
            manualBgIndex: -1,
            activeBgLayer: 1,
            currentBgUrl: '',
            sunTimes: { sunrise: null, sunset: null },
            timerRemainingSec: 0,
            timerInterval: null,
            controlsHideTimeout: null,
            wakeLockSentinel: null,
            soundIndex: 0,
            activeNoiseNode: null,
            activeFilterNode: null
        };

        const DOM = {
            bg1: document.getElementById('bg-layer-1'),
            bg2: document.getElementById('bg-layer-2'),
            blackoutOverlay: document.getElementById('blackout-overlay'),
            shifter: document.getElementById('burn-in-shifter'),
            
            // Clock & World Clock
            time: document.getElementById('time'),
            ampm: document.getElementById('ampm'),
            date: document.getElementById('date'),
            eventPill: document.getElementById('event-countdown-pill'),
            eventIcon: document.getElementById('event-icon'),
            eventText: document.getElementById('event-text'),
            worldClockPill: document.getElementById('world-clock-pill'),
            worldClockFlag: document.getElementById('world-clock-flag'),
            worldClockTime: document.getElementById('world-clock-time'),

            // Weather & Environment
            weatherIcon: document.getElementById('weather-icon'),
            weatherTemp: document.getElementById('weather-temp'),
            weatherDesc: document.getElementById('weather-desc'),
            pillFeels: document.getElementById('pill-feels'),
            pillRain: document.getElementById('pill-rain'),
            pillUv: document.getElementById('pill-uv'),
            pillAqi: document.getElementById('pill-aqi'),
            pillSun: document.getElementById('pill-sun'),
            pillMoon: document.getElementById('pill-moon'),
            offlineIndicator: document.getElementById('offline-indicator'),
            networkOfflinePill: document.getElementById('network-offline-pill'),
            rainTimelineBox: document.getElementById('next-hour-rain-box'),
            rainTimelineSummary: document.getElementById('rain-timeline-summary'),
            rainTimelineBars: document.getElementById('rain-timeline-bars'),

            // Timer & Touch Bar
            activeTimerCard: document.getElementById('active-timer-card'),
            timerDisplay: document.getElementById('timer-display'),
            cancelTimerBtn: document.getElementById('cancel-timer-btn'),
            touchBar: document.getElementById('touch-control-bar'),
            btnSwitchLocation: document.getElementById('btn-switch-location'),
            btnLocationLabel: document.getElementById('btn-location-label'),
            btnToggleSound: document.getElementById('btn-toggle-sound'),
            soundStatusLabel: document.getElementById('sound-status-label'),
            btnToggle24h: document.getElementById('btn-toggle-24h'),
            btnCycleBg: document.getElementById('btn-cycle-bg'),
            btnToggleNight: document.getElementById('btn-toggle-night'),
            btnBlackout: document.getElementById('btn-blackout'),
            btnRefreshWeather: document.getElementById('btn-refresh-weather')
        };

        /* ==========================================================================
           1. CLOCK, WORLD CLOCK, DATE, SUN/MOON & COUNTDOWN LOGIC
           ========================================================================== */
        function getActiveLocation() {
            return CONFIG.LOCATIONS[state.locationIndex] || CONFIG.LOCATIONS[0];
        }

        function updateLocationDisplay() {
            const loc = getActiveLocation();
            DOM.btnLocationLabel.textContent = loc.NAME.split(',')[0];
            DOM.worldClockFlag.textContent = CONFIG.WORLD_CLOCK.FLAG;
        }

        function updateClock() {
            const now = new Date();
            const timeFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, {
                timeZone: CONFIG.TIMEZONE,
                hour: 'numeric',
                minute: '2-digit',
                hour12: !state.use24Hour
            });

            const parts = timeFormatter.formatToParts(now);
            const hour = parts.find(p => p.type === 'hour')?.value || '--';
            const minute = parts.find(p => p.type === 'minute')?.value || '--';
            const dayPeriod = parts.find(p => p.type === 'dayPeriod')?.value || '';

            DOM.time.textContent = `${hour}:${minute}`;
            DOM.ampm.textContent = state.use24Hour ? '' : dayPeriod;
            DOM.ampm.style.display = state.use24Hour ? 'none' : 'inline';

            const dateFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, {
                timeZone: CONFIG.TIMEZONE,
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });
            DOM.date.textContent = dateFormatter.format(now);

            updateWorldClock(now);
            updateSunCountdown(now);
            updateMoonPhase(now);
        }

        function updateWorldClock(now) {
            if (!CONFIG.WORLD_CLOCK.ENABLED) {
                DOM.worldClockPill.classList.add('hidden');
                return;
            }
            try {
                const wcFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, {
                    timeZone: CONFIG.WORLD_CLOCK.TIMEZONE,
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: !state.use24Hour
                });
                DOM.worldClockTime.textContent = wcFormatter.format(now);
                DOM.worldClockPill.classList.remove('hidden');
            } catch (e) {
                DOM.worldClockPill.classList.add('hidden');
            }
        }

        function updateSunCountdown(now) {
            const { sunrise, sunset } = state.sunTimes;
            if (!sunrise || !sunset) return;

            let target, label, icon;
            if (now < sunrise) {
                target = sunrise;
                label = 'Sunrise';
                icon = '🌅';
            } else if (now < sunset) {
                target = sunset;
                label = 'Sunset';
                icon = '🌇';
            } else {
                target = new Date(sunrise.getTime() + 86400000);
                label = 'Sunrise';
                icon = '🌅';
            }

            const diffMins = Math.max(1, Math.round((target - now) / 60000));
            const hrs = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            const timeStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
            DOM.pillSun.textContent = `${icon} ${label} in ${timeStr}`;
        }

        function updateMoonPhase(now) {
            const synodicMonth = 29.53058867;
            const knownNewMoon = new Date('2000-01-06T18:14:00Z').getTime();
            const daysSince = (now.getTime() - knownNewMoon) / 86400000;
            const phase = ((daysSince % synodicMonth) + synodicMonth) % synodicMonth;
            const illumination = Math.round(((1 - Math.cos((2 * Math.PI * phase) / synodicMonth)) / 2) * 100);

            let icon = '🌑', name = 'New Moon';
            if (phase < 1.845) { icon = '🌑'; name = 'New Moon'; }
            else if (phase < 5.536) { icon = '🌒'; name = 'Waxing Crescent'; }
            else if (phase < 9.228) { icon = '🌓'; name = 'First Quarter'; }
            else if (phase < 12.919) { icon = '🌔'; name = 'Waxing Gibbous'; }
            else if (phase < 16.610) { icon = '🌕'; name = 'Full Moon'; }
            else if (phase < 20.302) { icon = '🌖'; name = 'Waning Gibbous'; }
            else if (phase < 23.993) { icon = '🌗'; name = 'Last Quarter'; }
            else if (phase < 27.684) { icon = '🌘'; name = 'Waning Crescent'; }

            DOM.pillMoon.textContent = `${icon} ${name} (${illumination}%)`;
        }

        function updateNextEvent() {
            if (!CONFIG.EVENTS || CONFIG.EVENTS.length === 0) return;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const currentYear = today.getFullYear();

            let closestEvent = null;
            let minDays = Infinity;

            for (const ev of CONFIG.EVENTS) {
                let evDate = new Date(currentYear, ev.MONTH - 1, ev.DAY);
                if (evDate < today) {
                    evDate = new Date(currentYear + 1, ev.MONTH - 1, ev.DAY);
                }
                const diffDays = Math.round((evDate - today) / 86400000);
                if (diffDays < minDays) {
                    minDays = diffDays;
                    closestEvent = ev;
                }
            }

            if (closestEvent) {
                DOM.eventIcon.textContent = closestEvent.ICON;
                if (minDays === 0) {
                    DOM.eventText.textContent = `Today is ${closestEvent.NAME}!`;
                } else if (minDays === 1) {
                    DOM.eventText.textContent = `Tomorrow: ${closestEvent.NAME}`;
                } else {
                    DOM.eventText.textContent = `${minDays} days until ${closestEvent.NAME}`;
                }
                DOM.eventPill.classList.remove('hidden');
            }
        }

        /* ==========================================================================
           2. NIGHT MODE, BURN-IN PIXEL SHIFT, WAKE LOCK & NETWORK STATUS
           ========================================================================== */
        function updateNightMode() {
            const hour = new Date().getHours();
            const { ENABLED, START_HOUR, END_HOUR, BRIGHTNESS, WARM_TINT, HIDE_EXTRA_WIDGETS } = CONFIG.NIGHT_MODE;

            let isNight = false;
            if (state.nightModeOverride !== null) {
                isNight = state.nightModeOverride;
            } else if (ENABLED) {
                isNight = START_HOUR > END_HOUR
                    ? (hour >= START_HOUR || hour < END_HOUR)
                    : (hour >= START_HOUR && hour < END_HOUR);
            }

            document.documentElement.style.setProperty('--night-brightness', isNight ? BRIGHTNESS : 1);
            document.documentElement.style.setProperty('--night-sepia', isNight ? WARM_TINT : 0);

            if (isNight && HIDE_EXTRA_WIDGETS) {
                document.body.classList.add('is-night-mode');
            } else {
                document.body.classList.remove('is-night-mode');
            }
        }

        function runPixelShift() {
            if (!CONFIG.PIXEL_SHIFT.ENABLED) return;
            const max = CONFIG.PIXEL_SHIFT.MAX_OFFSET_PX;
            const x = Math.floor(Math.random() * (max * 2 + 1)) - max;
            const y = Math.floor(Math.random() * (max * 2 + 1)) - max;
            DOM.shifter.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        }

        async function initWakeLock() {
            if (!CONFIG.KEEP_SCREEN_AWAKE || !('wakeLock' in navigator)) return;
            try {
                state.wakeLockSentinel = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.warn('Wake Lock unavailable:', err.message);
            }
        }

        function updateNetworkStatus() {
            if (navigator.onLine) {
                DOM.networkOfflinePill.classList.add('hidden');
            } else {
                DOM.networkOfflinePill.classList.remove('hidden');
            }
        }

        /* ==========================================================================
           3. PRELOADED CROSS-FADE BACKGROUND WALLPAPER ENGINE
           ========================================================================== */
        function selectBackgroundUrl(weatherCode, isDay) {
            const BG = CONFIG.BACKGROUNDS;
            if (weatherCode >= 95) return BG.THUNDERSTORM;
            if ((weatherCode >= 51 && weatherCode <= 67) || (weatherCode >= 80 && weatherCode <= 82)) return BG.RAIN;
            if ((weatherCode >= 71 && weatherCode <= 77) || weatherCode === 85 || weatherCode === 86) return BG.SNOW;
            if (weatherCode === 45 || weatherCode === 48) return BG.FOG;
            if (!isDay) return BG.NIGHT_CLEAR;
            if (weatherCode === 2 || weatherCode === 3) return BG.CLOUDY_DAY;
            return BG.DAY_CLEAR;
        }

        function applyBackgroundUrl(targetUrl) {
            if (!targetUrl || targetUrl === state.currentBgUrl) return;

            const preloader = new Image();
            preloader.onload = () => {
                state.currentBgUrl = targetUrl;
                const incoming = state.activeBgLayer === 1 ? DOM.bg2 : DOM.bg1;
                const outgoing = state.activeBgLayer === 1 ? DOM.bg1 : DOM.bg2;

                incoming.style.backgroundImage = `url('${targetUrl}')`;
                incoming.classList.replace('opacity-0', 'opacity-100');
                outgoing.classList.replace('opacity-100', 'opacity-0');

                state.activeBgLayer = state.activeBgLayer === 1 ? 2 : 1;
            };
            preloader.src = targetUrl;
        }

        /* ==========================================================================
           4. WEATHER, AIR QUALITY & NEXT-HOUR RAIN TIMELINE
           ========================================================================== */
        function getWeatherDetails(code) {
            const map = {
                0:  { text: 'Clear Sky', icon: '☀️' },
                1:  { text: 'Mainly Clear', icon: '🌤️' },
                2:  { text: 'Partly Cloudy', icon: '⛅' },
                3:  { text: 'Overcast', icon: '☁️' },
                45: { text: 'Foggy', icon: '🌫️' },
                48: { text: 'Rime Fog', icon: '🌫️' },
                51: { text: 'Light Drizzle', icon: '🌧️' },
                53: { text: 'Moderate Drizzle', icon: '🌧️' },
                55: { text: 'Dense Drizzle', icon: '🌧️' },
                61: { text: 'Slight Rain', icon: '🌧️' },
                63: { text: 'Moderate Rain', icon: '🌧️' },
                65: { text: 'Heavy Rain', icon: '🌧️' },
                71: { text: 'Slight Snow', icon: '❄️' },
                73: { text: 'Moderate Snow', icon: '❄️' },
                75: { text: 'Heavy Snow', icon: '❄️' },
                77: { text: 'Snow Grains', icon: '❄️' },
                80: { text: 'Slight Showers', icon: '🌦️' },
                81: { text: 'Moderate Showers', icon: '🌦️' },
                82: { text: 'Violent Showers', icon: '⛈️' },
                95: { text: 'Thunderstorm', icon: '⛈️' },
                96: { text: 'Thunderstorm & Hail', icon: '⛈️' },
                99: { text: 'Heavy Thunderstorm', icon: '⛈️' }
            };
            return map[code] || { text: 'Clear', icon: '🌡️' };
        }

        function getAqiLabel(aqi) {
            if (aqi == null) return '🍃 AQI --';
            if (aqi <= 50) return `🍃 AQI ${aqi} Good`;
            if (aqi <= 100) return `🟡 AQI ${aqi} Mod`;
            return `🟠 AQI ${aqi} Poor`;
        }

        function renderNextHourRain(minutely15) {
            if (!CONFIG.SHOW_NEXT_HOUR_RAIN || !minutely15 || !Array.isArray(minutely15.time)) {
                DOM.rainTimelineBox.classList.add('hidden');
                return;
            }

            const now = Date.now();
            const upcoming = [];

            for (let i = 0; i < minutely15.time.length && upcoming.length < 4; i++) {
                const slotTime = new Date(minutely15.time[i]).getTime();
                if (slotTime >= now - 900000) {
                    upcoming.push({
                        time: new Date(slotTime),
                        precip: minutely15.precipitation?.[i] ?? 0
                    });
                }
            }

            const maxPrecip = Math.max(...upcoming.map(u => u.precip), 0);
            if (upcoming.length < 4 || maxPrecip <= 0.05) {
                DOM.rainTimelineBox.classList.add('hidden');
                return;
            }

            const firstRainIdx = upcoming.findIndex(u => u.precip > 0.05);
            DOM.rainTimelineSummary.textContent = firstRainIdx === 0 ? 'Raining Now' : `In ~${firstRainIdx * 15}m`;

            let barsHtml = '';
            upcoming.forEach((slot, idx) => {
                const heightPct = Math.min(100, Math.max(18, Math.round((slot.precip / Math.max(maxPrecip, 1)) * 100)));
                const label = idx === 0 ? 'Now' : `+${idx * 15}m`;
                const barColor = slot.precip > 0.05 ? 'bg-sky-400' : 'bg-white/20';
                barsHtml += `
                    <div class="flex flex-col items-center gap-0.5 h-full justify-end">
                        <div class="w-full rounded-t ${barColor} transition-all" style="height: ${heightPct}%"></div>
                        <span class="text-[9px] text-sky-100/80 leading-none">${label}</span>
                    </div>
                `;
            });

            DOM.rainTimelineBars.innerHTML = barsHtml;
            DOM.rainTimelineBox.classList.remove('hidden');
        }

        function renderWeather(weatherData, aqiData, isCached = false) {
            if (!weatherData || !weatherData.current) return;

            const current = weatherData.current;
            const daily = weatherData.daily;

            const temp = Math.round(current.temperature_2m);
            const feelsLike = Math.round(current.apparent_temperature ?? temp);
            const code = current.weather_code;
            const isDay = current.is_day === 1;
            const info = getWeatherDetails(code);

            DOM.weatherTemp.textContent = `${temp}°`;
            DOM.weatherDesc.textContent = info.text;
            DOM.weatherIcon.textContent = info.icon;
            DOM.pillFeels.textContent = `Feels ${feelsLike}°`;

            const rainChance = daily?.precipitation_probability_max?.[0] ?? 0;
            const uvMax = daily?.uv_index_max?.[0] != null ? Math.round(daily.uv_index_max[0]) : '--';
            DOM.pillRain.textContent = `💧 ${rainChance}%`;
            DOM.pillUv.textContent = `☀️ UV ${uvMax}`;

            const usAqi = aqiData?.current?.us_aqi ?? null;
            DOM.pillAqi.textContent = getAqiLabel(usAqi);

            if (daily?.sunrise?.[0] && daily?.sunset?.[0]) {
                state.sunTimes = {
                    sunrise: new Date(daily.sunrise[0]),
                    sunset: new Date(daily.sunset[0])
                };
                updateSunCountdown(new Date());
            }

            renderNextHourRain(weatherData.minutely_15);

            if (isCached) {
                DOM.offlineIndicator.classList.remove('hidden');
            } else {
                DOM.offlineIndicator.classList.add('hidden');
            }

            if (state.manualBgIndex === -1) {
                applyBackgroundUrl(selectBackgroundUrl(code, isDay));
            }
        }

        async function fetchWithTimeout(url) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), CONFIG.FETCH_TIMEOUT_MS);
            try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function fetchWeather() {
            const loc = getActiveLocation();
            const cacheKey = `${CONFIG.STORAGE_KEY}_${loc.LAT}_${loc.LON}_${CONFIG.TEMP_UNIT}`;

            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${loc.LAT}&longitude=${loc.LON}`
                + `&current=temperature_2m,apparent_temperature,is_day,weather_code`
                + `&minutely_15=precipitation`
                + `&daily=sunrise,sunset,uv_index_max,precipitation_probability_max`
                + `&temperature_unit=${CONFIG.TEMP_UNIT}&timezone=auto&forecast_days=1`;

            const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.LAT}&longitude=${loc.LON}&current=us_aqi`;

            try {
                const [weatherData, aqiData] = await Promise.all([
                    fetchWithTimeout(weatherUrl),
                    fetchWithTimeout(aqiUrl).catch(() => null)
                ]);

                localStorage.setItem(cacheKey, JSON.stringify({
                    timestamp: Date.now(),
                    weatherData,
                    aqiData
                }));

                updateNetworkStatus();
                renderWeather(weatherData, aqiData, false);
            } catch (error) {
                console.warn('Weather fetch failed, checking cache:', error);
                updateNetworkStatus();
                const cachedRaw = localStorage.getItem(cacheKey);
                if (cachedRaw) {
                    const cached = JSON.parse(cachedRaw);
                    if (Date.now() - cached.timestamp <= CONFIG.CACHE_TTL_MS) {
                        renderWeather(cached.weatherData, cached.aqiData, true);
                        return;
                    }
                }
                DOM.weatherDesc.textContent = 'Weather Unavailable';
                applyBackgroundUrl(CONFIG.BACKGROUNDS.DAY_CLEAR);
            }
        }

        /* ==========================================================================
           5. INTERACTIVE KITCHEN TIMERS & AMBIENT SOUNDSCAPES (TONE.JS)
           ========================================================================== */
        function playChime() {
            try {
                if (typeof Tone !== 'undefined') {
                    Tone.start();
                    const synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    const now = Tone.now();
                    synth.triggerAttackRelease('C5', '8n', now);
                    synth.triggerAttackRelease('E5', '8n', now + 0.18);
                    synth.triggerAttackRelease('G5', '4n', now + 0.36);
                }
            } catch (e) {
                console.warn('Audio chime skipped:', e);
            }
        }

        function stopAmbientSound() {
            if (state.activeNoiseNode) {
                try { state.activeNoiseNode.stop(); state.activeNoiseNode.dispose(); } catch (e) {}
                state.activeNoiseNode = null;
            }
            if (state.activeFilterNode) {
                try { state.activeFilterNode.dispose(); } catch (e) {}
                state.activeFilterNode = null;
            }
        }

        async function cycleAmbientSound() {
            stopAmbientSound();
            state.soundIndex = (state.soundIndex + 1) % CONFIG.CONTROLS.SOUND_PRESETS.length;
            const preset = CONFIG.CONTROLS.SOUND_PRESETS[state.soundIndex];
            DOM.soundStatusLabel.textContent = `Sound: ${preset}`;

            if (preset === 'Off' || typeof Tone === 'undefined') return;

            try {
                await Tone.start();
                if (preset === 'Brown Noise') {
                    state.activeNoiseNode = new Tone.Noise('brown').toDestination();
                    state.activeNoiseNode.volume.value = -16;
                    state.activeNoiseNode.start();
                } else if (preset === 'Soft Rain') {
                    state.activeFilterNode = new Tone.Filter(800, 'lowpass').toDestination();
                    state.activeNoiseNode = new Tone.Noise('pink').connect(state.activeFilterNode);
                    state.activeNoiseNode.volume.value = -18;
                    state.activeNoiseNode.start();
                } else if (preset === 'White Noise') {
                    state.activeNoiseNode = new Tone.Noise('white').toDestination();
                    state.activeNoiseNode.volume.value = -24;
                    state.activeNoiseNode.start();
                }
            } catch (e) {
                console.warn('Ambient audio failed:', e);
            }
        }

        function startTimer(minutes) {
            clearInterval(state.timerInterval);
            state.timerRemainingSec = minutes * 60;
            DOM.activeTimerCard.classList.remove('hidden');
            updateTimerDisplay();

            state.timerInterval = setInterval(() => {
                state.timerRemainingSec--;
                if (state.timerRemainingSec <= 0) {
                    clearInterval(state.timerInterval);
                    DOM.timerDisplay.textContent = 'DONE!';
                    playChime();
                    setTimeout(() => DOM.activeTimerCard.classList.add('hidden'), 6000);
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(state.timerRemainingSec / 60).toString().padStart(2, '0');
            const secs = (state.timerRemainingSec % 60).toString().padStart(2, '0');
            DOM.timerDisplay.textContent = `${mins}:${secs}`;
        }

        /* ==========================================================================
           6. TOUCH CONTROL BAR & DOUBLE-TAP BLACKOUT SCREEN
           ========================================================================== */
        function revealTouchControls() {
            DOM.touchBar.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            clearTimeout(state.controlsHideTimeout);
            state.controlsHideTimeout = setTimeout(() => {
                DOM.touchBar.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, CONFIG.CONTROLS.AUTO_HIDE_MS);
        }

        function enterBlackoutMode() {
            DOM.blackoutOverlay.classList.remove('hidden');
            DOM.touchBar.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        }

        function exitBlackoutMode(e) {
            e.stopPropagation();
            DOM.blackoutOverlay.classList.add('hidden');
        }

        function setupTouchControls() {
            document.body.addEventListener('click', (e) => {
                if (!DOM.blackoutOverlay.classList.contains('hidden')) return;
                if (!DOM.touchBar.contains(e.target)) {
                    revealTouchControls();
                }
            });

            document.body.addEventListener('dblclick', (e) => {
                if (DOM.touchBar.contains(e.target) || e.target.closest('button')) return;
                enterBlackoutMode();
            });

            DOM.blackoutOverlay.addEventListener('click', exitBlackoutMode);
            DOM.btnBlackout.addEventListener('click', (e) => {
                e.stopPropagation();
                enterBlackoutMode();
            });

            document.querySelectorAll('.timer-preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startTimer(parseInt(btn.dataset.timer, 10));
                    revealTouchControls();
                });
            });

            DOM.cancelTimerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                clearInterval(state.timerInterval);
                DOM.activeTimerCard.classList.add('hidden');
            });

            DOM.btnToggleSound.addEventListener('click', (e) => {
                e.stopPropagation();
                cycleAmbientSound();
                revealTouchControls();
            });

            DOM.btnSwitchLocation.addEventListener('click', (e) => {
                e.stopPropagation();
                state.locationIndex = (state.locationIndex + 1) % CONFIG.LOCATIONS.length;
                updateLocationDisplay();
                fetchWeather();
                revealTouchControls();
            });

            DOM.btnToggle24h.addEventListener('click', (e) => {
                e.stopPropagation();
                state.use24Hour = !state.use24Hour;
                updateClock();
                revealTouchControls();
            });

            DOM.btnCycleBg.addEventListener('click', (e) => {
                e.stopPropagation();
                const urls = Object.values(CONFIG.BACKGROUNDS);
                state.manualBgIndex = (state.manualBgIndex + 1) % urls.length;
                applyBackgroundUrl(urls[state.manualBgIndex]);
                revealTouchControls();
            });

            DOM.btnToggleNight.addEventListener('click', (e) => {
                e.stopPropagation();
                const currentlyNight = document.body.classList.contains('is-night-mode');
                state.nightModeOverride = !currentlyNight;
                updateNightMode();
                revealTouchControls();
            });

            DOM.btnRefreshWeather.addEventListener('click', (e) => {
                e.stopPropagation();
                DOM.weatherDesc.textContent = 'Refreshing...';
                fetchWeather();
                revealTouchControls();
            });
        }

        /* ==========================================================================
           7. INITIALIZATION
           ========================================================================== */
        function init() {
            updateLocationDisplay();
            updateClock();
            updateNextEvent();
            updateNightMode();
            initWakeLock();
            setupTouchControls();
            updateNetworkStatus();

            applyBackgroundUrl(CONFIG.BACKGROUNDS.DAY_CLEAR);
            fetchWeather();

            setInterval(() => {
                updateClock();
                if (new Date().getSeconds() === 0) {
                    updateNightMode();
                    updateNextEvent();
                }
            }, CONFIG.CLOCK_INTERVAL_MS);

            setInterval(fetchWeather, CONFIG.WEATHER_INTERVAL_MS);
            setInterval(runPixelShift, CONFIG.PIXEL_SHIFT.INTERVAL_MS);

            window.addEventListener('online', () => {
                updateNetworkStatus();
                fetchWeather();
            });
            window.addEventListener('offline', updateNetworkStatus);

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    updateClock();
                    updateNightMode();
                    initWakeLock();
                }
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
