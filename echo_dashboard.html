<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Show Smart Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tone.js for Local Kitchen Timer Chimes & Ambient Soundscapes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        /* @import placed first before any CSS rules */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');

        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #090d16;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* High-contrast shadow for readability over dynamic photography */
        .text-shadow-heavy {
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.75), 0 0 36px rgba(0, 0, 0, 0.55);
        }

        /* Glassmorphic panel styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .glass-pill {
            background: rgba(15, 23, 42, 0.42);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Dual-layer cross-fading background canvases */
        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1.4s ease-in-out;
            will-change: opacity;
        }

        /* Smooth OLED/LCD burn-in pixel shift transition */
        #dashboard-root {
            transition: transform 2.5s ease-in-out;
            will-change: transform;
        }

        /* Night mode dimming & warm amber tint */
        #night-overlay {
            background: radial-gradient(circle at center, rgba(15, 8, 0, 0.55) 0%, rgba(0, 0, 0, 0.85) 100%);
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        /* Always-visible subtle bottom-right control dock */
        #control-dock {
            opacity: 0.85;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #control-dock:hover,
        #control-dock:focus-within {
            opacity: 1;
        }

        /* Respect OS Reduced Motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden">

    <!-- Dual Background Layers for Zero-Flicker Cross-Fades -->
    <div id="bg-layer-1" class="bg-layer z-0 opacity-100"></div>
    <div id="bg-layer-2" class="bg-layer z-0 opacity-0"></div>

    <!-- Ambient Contrast Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/45 via-black/15 to-black/75 z-10 pointer-events-none"></div>

    <!-- Auto Night Mode Dimming Layer -->
    <div id="night-overlay" class="absolute inset-0 z-30 opacity-0"></div>

    <!-- Full-Screen Blackout Sleep Overlay (Double-Tap or Dock Button to toggle) -->
    <div id="blackout-overlay" class="hidden fixed inset-0 bg-black z-50 cursor-pointer flex items-center justify-center">
        <span class="text-white/20 text-xs uppercase tracking-widest select-none">Tap anywhere to wake</span>
    </div>

    <!-- Always-Present Bottom-Center Touch Control Dock (TIMERS & Controls) -->
    <div id="control-dock" class="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-40 w-max max-w-[95vw]">
        <div class="glass-panel rounded-2xl p-2 sm:p-2.5 flex flex-wrap justify-center items-center gap-1.5 shadow-2xl text-xs sm:text-sm font-medium">
            <span class="text-[11px] font-bold uppercase tracking-wider text-white/60 px-1.5 hidden sm:inline">Timers</span>
            <!-- Quick Kitchen Timers -->
            <button type="button" data-timer="5" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">⏱️ 5m</button>
            <button type="button" data-timer="10" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">10m</button>
            <button type="button" data-timer="15" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">15m</button>
            <button type="button" data-timer="30" class="timer-btn px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition">30m</button>
            <button type="button" id="btn-cancel-timer" class="hidden px-2.5 py-1.5 rounded-xl bg-red-500/40 hover:bg-red-500/60 text-red-100 active:scale-95 transition">✕ Stop</button>

            <div class="h-4 w-px bg-white/20 mx-0.5"></div>

            <!-- Display & Audio Actions -->
            <button type="button" id="btn-ambient-sound" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Ambient Soundscape">🎧 Off</button>
            <button type="button" id="btn-cycle-bg" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Cycle Wallpaper">🖼️ BG</button>
            <button type="button" id="btn-toggle-night" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Toggle Night Dimming">🌙 Night</button>
            <button type="button" id="btn-blackout" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Turn Screen Black">⬛ Off</button>
            <button type="button" id="btn-refresh" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/25 active:scale-95 transition" title="Refresh Data">🔄</button>
        </div>
    </div>

    <!-- Main Dashboard Container (Shifts subtly to prevent OLED/LCD burn-in) -->
    <main id="dashboard-root" class="relative z-20 flex flex-col justify-between h-full w-full p-5 sm:p-8 md:p-10 pb-20 sm:pb-24">

        <!-- TOP-LEFT: Stacked HEBCAL Schedule -->
        <header class="flex justify-between items-start w-full">
            <section id="hebcal-card" aria-live="polite" aria-label="Jewish calendar and Shabbat times" class="max-w-xs sm:max-w-sm">
                <div id="hebcal-events-list" class="flex flex-col gap-2 text-xs sm:text-sm text-white/95">
                    <div class="glass-panel rounded-xl px-3.5 py-2.5 text-white/60 shadow-lg">Loading schedule...</div>
                </div>
            </section>

            <!-- Offline Indicator Badge (Top-Right if disconnected) -->
            <div id="network-offline-pill" class="hidden inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-500/30 border border-red-400/50 text-red-100 text-xs font-semibold animate-pulse">
                <span class="w-2 h-2 rounded-full bg-red-400"></span>
                <span>Offline</span>
            </div>
        </header>

        <!-- CENTER HERO: [NOV / 11] + [TIME] on top row, [Weather] directly underneath -->
        <section class="my-auto mx-auto flex flex-col items-center justify-center text-center text-shadow-heavy w-full max-w-4xl px-2">

            <!-- Status Badges Row: Israel World Clock, Holiday Countdown & Active Timer -->
            <div class="flex flex-wrap items-center justify-center gap-2 mb-2 sm:mb-3">
                <div id="world-clock-pill" class="glass-pill px-3 py-1 rounded-full text-xs sm:text-sm font-semibold text-white flex items-center gap-1.5">
                    <span aria-hidden="true">🇮🇱</span>
                    <span id="world-clock-time">--:--</span>
                </div>
                <div id="countdown-badge" class="hidden glass-pill px-3 py-1 rounded-full text-xs sm:text-sm font-medium text-amber-200"></div>
                <div id="timer-badge" class="hidden px-3 py-1 rounded-full bg-emerald-500/35 border border-emerald-300/50 text-emerald-100 text-xs sm:text-sm font-bold animate-pulse">
                    ⏱️ <span id="timer-display">00:00</span>
                </div>
            </div>

            <!-- Row 1: Stacked Month/Day on Left + Large TIME on Right -->
            <div class="flex items-center justify-center gap-3 sm:gap-5 md:gap-6">
                <!-- Stacked Date (NOV / 11) -->
                <div aria-live="polite" class="flex flex-col items-center justify-center leading-none border-r border-white/25 pr-3 sm:pr-5 py-1">
                    <span id="date-month" class="text-xl sm:text-2xl md:text-3xl font-bold uppercase tracking-widest text-amber-200/95">---</span>
                    <span id="date-day" class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight mt-0.5">--</span>
                </div>

                <!-- Main Digital Clock -->
                <div aria-live="off" class="flex items-baseline gap-1.5 sm:gap-2.5">
                    <div id="time" class="text-7xl sm:text-8xl md:text-9xl lg:text-[10rem] font-black leading-none tracking-tight">--:--</div>
                    <div id="ampm" class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold opacity-90"></div>
                </div>
            </div>

            <!-- Row 2: Weather Directly Below TIME -->
            <div aria-live="polite" aria-label="Current weather and environmental conditions" class="flex flex-col items-center mt-2 sm:mt-3 w-full">
                <div class="flex items-center justify-center gap-2.5 sm:gap-3.5">
                    <span id="weather-icon" class="text-3xl sm:text-4xl md:text-5xl" aria-hidden="true">🌡️</span>
                    <span id="weather-temp" class="text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight">--°</span>
                    <span id="weather-desc" class="text-xl sm:text-2xl md:text-3xl font-medium text-white/95">Loading weather...</span>
                </div>

                <!-- Compact Environmental Metric Pills -->
                <div class="flex flex-wrap justify-center gap-1.5 sm:gap-2 mt-3 max-w-2xl">
                    <span id="pill-feels" class="glass-pill px-2.5 py-1 rounded-full text-xs font-medium text-white/90">Feels --°</span>
                    <span id="pill-rain" class="glass-pill px-2.5 py-1 rounded-full text-xs font-medium text-sky-200">💧 --%</span>
                    <span id="pill-uv" class="glass-pill px-2.5 py-1 rounded-full text-xs font-medium text-amber-200">☀️ UV --</span>
                    <span id="pill-aqi" class="glass-pill px-2.5 py-1 rounded-full text-xs font-medium text-emerald-200">🍃 AQI --</span>
                    <span id="pill-sun" class="glass-pill px-2.5 py-1 rounded-full text-xs font-medium text-orange-200">🌅 --:--</span>
                    <span id="pill-moon" class="glass-pill px-2.5 py-1 rounded-full text-xs font-medium text-indigo-200">🌓 --</span>
                </div>

                <!-- Next-Hour Rain Timeline (Automatically appears when precipitation is expected in next 60m) -->
                <div id="next-hour-rain-box" class="hidden glass-panel rounded-xl p-2.5 mt-2.5 w-full max-w-xs text-left">
                    <div class="flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-sky-200 mb-1.5">
                        <span>🌧️ Next 60 Min Rain</span>
                        <span id="next-hour-rain-label">Expected</span>
                    </div>
                    <div id="next-hour-rain-bars" class="grid grid-cols-4 gap-1.5 items-end h-10"></div>
                </div>
            </div>

        </section>

        <!-- Bottom Spacer to keep Center Hero balanced above the fixed bottom-right Timers dock -->
        <div class="h-4 sm:h-6 pointer-events-none"></div>

    </main>

    <script>
        /* ==========================================================================
           MASTER CONFIGURATION (Edit all customizable settings right here)
           ========================================================================== */
        const CONFIG = {
            // 1. Primary Location & Weather Units
            LOCATION: {
                NAME: 'Teaneck, NJ',
                LAT: 40.8976,
                LON: -74.0154
            },
            TEMP_UNIT: 'fahrenheit',          // 'fahrenheit' or 'celsius'
            WIND_UNIT: 'mph',                 // 'mph', 'kmh', 'ms', or 'kn'

            // 2. Clock & Locale Settings
            LOCALE: 'en-US',
            TIMEZONE: undefined,              // Leave undefined for system local timezone
            USE_24_HOUR: false,               // false = 12-hour (AM/PM), true = 24-hour

            // 3. Secondary World Clock (Israel)
            WORLD_CLOCK: {
                ENABLED: true,
                FLAG: '🇮🇱',
                TIMEZONE: 'Asia/Jerusalem'
            },

            // 4. Hebcal Shabbat & Jewish Holiday Times
            HEBCAL: {
                ENABLED: true,
                CANDLE_LIGHTING_MINS: 18,
                HAVDALAH_MINS: 50,
                MAX_ITEMS: 4
            },

            // 5. Auto Night Mode & Burn-In Protection
            NIGHT_MODE: {
                ENABLED: true,
                START_HOUR: 22,               // 10:00 PM
                END_HOUR: 6                   // 6:00 AM
            },
            PIXEL_SHIFT: {
                ENABLED: true,
                MAX_OFFSET_PX: 4,
                INTERVAL_MS: 15 * 60 * 1000   // Shift gently every 15 minutes
            },

            // 6. Refresh Intervals & Caching
            CLOCK_INTERVAL_MS: 1000,
            WEATHER_INTERVAL_MS: 10 * 60 * 1000,
            FETCH_TIMEOUT_MS: 8000,
            STORAGE_KEY: 'echo_dashboard_cache_v4',

            // 7. Upcoming Event Countdowns (Month is 1-12)
            EVENTS: [
                { NAME: 'Hanukkah', MONTH: 12, DAY: 4 },
                { NAME: 'New Year', MONTH: 1, DAY: 1 },
                { NAME: 'Passover', MONTH: 4, DAY: 21 }
            ],

            // 8. Ambient Soundscape Volumes (dB)
            SOUND: {
                VOLUME_DB: -18,
                CHIME_VOLUME_DB: -10
            },

            // 9. Dynamic Weather & Time-of-Day Wallpapers
            BACKGROUNDS: {
                CLEAR_DAY: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80',
                CLEAR_NIGHT: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80',
                CLOUDY_DAY: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80',
                FOG: 'https://images.unsplash.com/photo-1487621167305-5d248087c724?auto=format&fit=crop&w=1920&q=80',
                RAIN: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1920&q=80',
                SNOW: 'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=1920&q=80',
                THUNDERSTORM: 'https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28?auto=format&fit=crop&w=1920&q=80',
                FALLBACK: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80'
            }
        };

        /* ==========================================================================
           APPLICATION STATE & DOM CACHE
           ========================================================================== */
        const state = {
            manualNightOverride: null, // null = auto schedule, true/false = manual override
            manualBgIndex: -1,
            activeBgLayer: 1,
            currentBgUrl: '',
            isBlackout: false,
            ambientIndex: 0, // 0 = Off, 1 = Brown Noise, 2 = Soft Rain, 3 = White Noise
            ambientNode: null,
            ambientGain: null,
            timerEndTime: null,
            timerInterval: null,
            wakeLock: null
        };

        const DOM = {
            root: document.getElementById('dashboard-root'),
            nightOverlay: document.getElementById('night-overlay'),
            blackoutOverlay: document.getElementById('blackout-overlay'),
            bgLayer1: document.getElementById('bg-layer-1'),
            bgLayer2: document.getElementById('bg-layer-2'),
            // Weather & Environment
            networkOfflinePill: document.getElementById('network-offline-pill'),
            weatherIcon: document.getElementById('weather-icon'),
            weatherTemp: document.getElementById('weather-temp'),
            weatherDesc: document.getElementById('weather-desc'),
            pillFeels: document.getElementById('pill-feels'),
            pillRain: document.getElementById('pill-rain'),
            pillUv: document.getElementById('pill-uv'),
            pillAqi: document.getElementById('pill-aqi'),
            pillSun: document.getElementById('pill-sun'),
            pillMoon: document.getElementById('pill-moon'),
            nextHourRainBox: document.getElementById('next-hour-rain-box'),
            nextHourRainLabel: document.getElementById('next-hour-rain-label'),
            nextHourRainBars: document.getElementById('next-hour-rain-bars'),
            // Hebcal Calendar
            hebcalCard: document.getElementById('hebcal-card'),
            hebcalEventsList: document.getElementById('hebcal-events-list'),
            // Clock, World Clock & Badges
            time: document.getElementById('time'),
            ampm: document.getElementById('ampm'),
            dateMonth: document.getElementById('date-month'),
            dateDay: document.getElementById('date-day'),
            worldClockPill: document.getElementById('world-clock-pill'),
            worldClockTime: document.getElementById('world-clock-time'),
            countdownBadge: document.getElementById('countdown-badge'),
            timerBadge: document.getElementById('timer-badge'),
            timerDisplay: document.getElementById('timer-display'),
            // Dock Controls
            btnCancelTimer: document.getElementById('btn-cancel-timer'),
            btnAmbientSound: document.getElementById('btn-ambient-sound'),
            btnCycleBg: document.getElementById('btn-cycle-bg'),
            btnToggleNight: document.getElementById('btn-toggle-night'),
            btnBlackout: document.getElementById('btn-blackout'),
            btnRefresh: document.getElementById('btn-refresh')
        };

        /* ==========================================================================
           DATE & TIME FORMATTERS
           ========================================================================== */
        const monthFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, {
            month: 'short',
            timeZone: CONFIG.TIMEZONE
        });

        const dayFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, {
            day: 'numeric',
            timeZone: CONFIG.TIMEZONE
        });

        const israelTimeFormatter = new Intl.DateTimeFormat(CONFIG.LOCALE, {
            hour: 'numeric',
            minute: '2-digit',
            hour12: !CONFIG.USE_24_HOUR,
            timeZone: CONFIG.WORLD_CLOCK.TIMEZONE
        });

        /* ==========================================================================
           CLOCK, WORLD CLOCK, COUNTDOWN & NIGHT MODE
           ========================================================================== */
        function updateClock() {
            const now = new Date();

            // Main Local Clock
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');

            if (CONFIG.USE_24_HOUR) {
                DOM.time.textContent = `${hours.toString().padStart(2, '0')}:${minutes}`;
                DOM.ampm.textContent = '';
            } else {
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                DOM.time.textContent = `${hours}:${minutes}`;
                DOM.ampm.textContent = ampm;
            }

            DOM.dateMonth.textContent = monthFormatter.format(now).toUpperCase();
            DOM.dateDay.textContent = dayFormatter.format(now);

            // Secondary World Clock (Israel Flag + Time)
            if (CONFIG.WORLD_CLOCK.ENABLED) {
                DOM.worldClockPill.classList.remove('hidden');
                DOM.worldClockTime.textContent = israelTimeFormatter.format(now);
            } else {
                DOM.worldClockPill.classList.add('hidden');
            }

            updateNightMode(now);
            updateEventCountdown(now);
            updateMoonPhase(now);
        }

        function updateNightMode(now = new Date()) {
            if (!CONFIG.NIGHT_MODE.ENABLED && state.manualNightOverride === null) {
                DOM.nightOverlay.style.opacity = '0';
                return;
            }

            let isNight = false;
            if (state.manualNightOverride !== null) {
                isNight = state.manualNightOverride;
            } else {
                const h = now.getHours();
                const { START_HOUR, END_HOUR } = CONFIG.NIGHT_MODE;
                isNight = START_HOUR > END_HOUR
                    ? (h >= START_HOUR || h < END_HOUR)
                    : (h >= START_HOUR && h < END_HOUR);
            }

            DOM.nightOverlay.style.opacity = isNight ? '1' : '0';
            DOM.btnToggleNight.textContent = isNight ? '☀️ Day' : '🌙 Night';
        }

        function updateEventCountdown(now) {
            if (!CONFIG.EVENTS || CONFIG.EVENTS.length === 0) {
                DOM.countdownBadge.classList.add('hidden');
                return;
            }

            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            let nearest = null;

            for (const ev of CONFIG.EVENTS) {
                let target = new Date(now.getFullYear(), ev.MONTH - 1, ev.DAY);
                if (target < todayMidnight) {
                    target = new Date(now.getFullYear() + 1, ev.MONTH - 1, ev.DAY);
                }
                const diffDays = Math.round((target - todayMidnight) / (1000 * 60 * 60 * 24));
                if (!nearest || diffDays < nearest.days) {
                    nearest = { name: ev.NAME, days: diffDays };
                }
            }

            if (nearest) {
                DOM.countdownBadge.classList.remove('hidden');
                DOM.countdownBadge.textContent = nearest.days === 0
                    ? `🎉 Today: ${nearest.name}`
                    : `✨ ${nearest.name} in ${nearest.days}d`;
            }
        }

        function updateMoonPhase(date) {
            // Synodic lunar cycle calculation (~29.53058867 days)
            const synodicMonth = 29.53058867;
            const knownNewMoon = new Date('2000-01-06T18:14:00Z').getTime();
            const daysSince = (date.getTime() - knownNewMoon) / 86400000;
            const cyclePos = ((daysSince % synodicMonth) + synodicMonth) % synodicMonth;
            const phaseRatio = cyclePos / synodicMonth;
            const illumination = Math.round((1 - Math.cos(phaseRatio * 2 * Math.PI)) * 50);

            let icon = '🌑';
            let label = 'New Moon';
            if (phaseRatio < 0.0625 || phaseRatio >= 0.9375) { icon = '🌑'; label = 'New'; }
            else if (phaseRatio < 0.1875) { icon = '🌒'; label = 'Wax Cres'; }
            else if (phaseRatio < 0.3125) { icon = '🌓'; label = '1st Qtr'; }
            else if (phaseRatio < 0.4375) { icon = '🌔'; label = 'Wax Gib'; }
            else if (phaseRatio < 0.5625) { icon = '🌕'; label = 'Full'; }
            else if (phaseRatio < 0.6875) { icon = '🌖'; label = 'Wan Gib'; }
            else if (phaseRatio < 0.8125) { icon = '🌗'; label = '3rd Qtr'; }
            else { icon = '🌘'; label = 'Wan Cres'; }

            DOM.pillMoon.textContent = `${icon} ${label} (${illumination}%)`;
        }

        /* ==========================================================================
           DYNAMIC WALLPAPER ENGINE (Preloaded Cross-Fade)
           ========================================================================== */
        function selectWeatherBackground(code, isDay) {
            if (state.manualBgIndex >= 0) {
                const keys = Object.keys(CONFIG.BACKGROUNDS);
                return CONFIG.BACKGROUNDS[keys[state.manualBgIndex % keys.length]];
            }

            if (code >= 95) return CONFIG.BACKGROUNDS.THUNDERSTORM;
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) return CONFIG.BACKGROUNDS.SNOW;
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return CONFIG.BACKGROUNDS.RAIN;
            if (code === 45 || code === 48) return CONFIG.BACKGROUNDS.FOG;
            if (!isDay) return CONFIG.BACKGROUNDS.CLEAR_NIGHT;
            if (code >= 2 && code <= 3) return CONFIG.BACKGROUNDS.CLOUDY_DAY;
            return CONFIG.BACKGROUNDS.CLEAR_DAY;
        }

        function setBackgroundImage(url) {
            if (!url || url === state.currentBgUrl) return;

            const preloader = new Image();
            preloader.onload = () => {
                state.currentBgUrl = url;
                if (state.activeBgLayer === 1) {
                    DOM.bgLayer2.style.backgroundImage = `url("${url}")`;
                    DOM.bgLayer2.style.opacity = '1';
                    DOM.bgLayer1.style.opacity = '0';
                    state.activeBgLayer = 2;
                } else {
                    DOM.bgLayer1.style.backgroundImage = `url("${url}")`;
                    DOM.bgLayer1.style.opacity = '1';
                    DOM.bgLayer2.style.opacity = '0';
                    state.activeBgLayer = 1;
                }
            };
            preloader.onerror = () => {
                if (url !== CONFIG.BACKGROUNDS.FALLBACK) {
                    setBackgroundImage(CONFIG.BACKGROUNDS.FALLBACK);
                }
            };
            preloader.src = url;
        }

        /* ==========================================================================
           WEATHER, AIR QUALITY & NEXT-HOUR RAIN FETCHING
           ========================================================================== */
        function getWeatherMeta(code) {
            const map = {
                0:  { text: 'Clear Sky', icon: '☀️' },
                1:  { text: 'Mainly Clear', icon: '🌤️' },
                2:  { text: 'Partly Cloudy', icon: '⛅' },
                3:  { text: 'Overcast', icon: '☁️' },
                45: { text: 'Foggy', icon: '🌫️' },
                48: { text: 'Rime Fog', icon: '🌫️' },
                51: { text: 'Light Drizzle', icon: '🌧️' },
                53: { text: 'Drizzle', icon: '🌧️' },
                55: { text: 'Dense Drizzle', icon: '🌧️' },
                61: { text: 'Light Rain', icon: '🌧️' },
                63: { text: 'Moderate Rain', icon: '🌧️' },
                65: { text: 'Heavy Rain', icon: '🌧️' },
                71: { text: 'Light Snow', icon: '❄️' },
                73: { text: 'Snowfall', icon: '❄️' },
                75: { text: 'Heavy Snow', icon: '❄️' },
                77: { text: 'Snow Grains', icon: '❄️' },
                80: { text: 'Rain Showers', icon: '🌦️' },
                81: { text: 'Moderate Showers', icon: '🌦️' },
                82: { text: 'Violent Showers', icon: '⛈️' },
                95: { text: 'Thunderstorm', icon: '⛈️' },
                96: { text: 'Storm & Hail', icon: '⛈️' },
                99: { text: 'Heavy Storm', icon: '⛈️' }
            };
            return map[code] || { text: 'Clear', icon: '🌡️' };
        }

        async function fetchWithTimeout(url, timeoutMs = CONFIG.FETCH_TIMEOUT_MS) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        function renderWeather(weatherData, aqiData, isCached = false) {
            if (!weatherData || !weatherData.current) return;

            const cur = weatherData.current;
            const daily = weatherData.daily || {};
            const meta = getWeatherMeta(cur.weather_code);

            DOM.weatherIcon.textContent = meta.icon;
            DOM.weatherTemp.textContent = `${Math.round(cur.temperature_2m)}°`;
            DOM.weatherDesc.textContent = isCached ? `${meta.text} (Cached)` : meta.text;

            // Pills
            const feels = cur.apparent_temperature !== undefined ? Math.round(cur.apparent_temperature) : '--';
            const rainProb = daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : '--';
            const uvMax = daily.uv_index_max ? Math.round(daily.uv_index_max[0]) : '--';
            const usAqi = aqiData && aqiData.current ? Math.round(aqiData.current.us_aqi) : '--';

            DOM.pillFeels.textContent = `Feels ${feels}°`;
            DOM.pillRain.textContent = `💧 ${rainProb}%`;
            DOM.pillUv.textContent = `☀️ UV ${uvMax}`;
            DOM.pillAqi.textContent = `🍃 AQI ${usAqi}`;

            // Next Sunrise or Sunset
            if (daily.sunrise && daily.sunset) {
                const now = new Date();
                const sunrise = new Date(daily.sunrise[0]);
                const sunset = new Date(daily.sunset[0]);
                const fmt = new Intl.DateTimeFormat(CONFIG.LOCALE, {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: !CONFIG.USE_24_HOUR
                });

                if (now < sunrise) {
                    DOM.pillSun.textContent = `🌅 ${fmt.format(sunrise)}`;
                } else if (now < sunset) {
                    DOM.pillSun.textContent = `🌇 ${fmt.format(sunset)}`;
                } else {
                    DOM.pillSun.textContent = `🌅 ${fmt.format(sunrise)}`;
                }
            }

            // Next-Hour Rain Timeline (from minutely_15)
            renderNextHourRain(weatherData.minutely_15);

            // Dynamic Wallpaper
            const bgUrl = selectWeatherBackground(cur.weather_code, Boolean(cur.is_day));
            setBackgroundImage(bgUrl);
        }

        function renderNextHourRain(minutely15) {
            if (!minutely15 || !minutely15.time || !minutely15.precipitation_probability) {
                DOM.nextHourRainBox.classList.add('hidden');
                return;
            }

            const nowMs = Date.now();
            let startIndex = minutely15.time.findIndex(t => new Date(t).getTime() >= nowMs - 15 * 60 * 1000);
            if (startIndex < 0) startIndex = 0;

            const sliceProbs = minutely15.precipitation_probability.slice(startIndex, startIndex + 4);
            const sliceTimes = minutely15.time.slice(startIndex, startIndex + 4);
            const maxProb = Math.max(...sliceProbs, 0);

            if (maxProb < 20 || sliceProbs.length === 0) {
                DOM.nextHourRainBox.classList.add('hidden');
                return;
            }

            DOM.nextHourRainBox.classList.remove('hidden');
            DOM.nextHourRainLabel.textContent = `Peak ${maxProb}%`;

            let barsHtml = '';
            sliceProbs.forEach((prob, idx) => {
                const heightPct = Math.max(15, prob);
                const tDate = new Date(sliceTimes[idx]);
                const minsLabel = idx === 0 ? 'Now' : `+${idx * 15}m`;
                barsHtml += `
                    <div class="flex flex-col items-center gap-1 h-full justify-end">
                        <div class="w-full bg-white/10 rounded-t-md h-6 flex items-end overflow-hidden">
                            <div class="w-full bg-sky-400 rounded-t-md transition-all" style="height: ${heightPct}%"></div>
                        </div>
                        <span class="text-[10px] text-white/75">${minsLabel}</span>
                    </div>
                `;
            });
            DOM.nextHourRainBars.innerHTML = barsHtml;
        }

        async function fetchWeatherAndEnv() {
            const loc = CONFIG.LOCATION;
            const cacheKey = `${CONFIG.STORAGE_KEY}_${loc.LAT}_${loc.LON}_${CONFIG.TEMP_UNIT}`;

            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${loc.LAT}&longitude=${loc.LON}&current=temperature_2m,apparent_temperature,is_day,weather_code&minutely_15=precipitation_probability,precipitation&daily=sunrise,sunset,uv_index_max,precipitation_probability_max&temperature_unit=${CONFIG.TEMP_UNIT}&wind_speed_unit=${CONFIG.WIND_UNIT}&timezone=auto&forecast_days=1`;
            const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.LAT}&longitude=${loc.LON}&current=us_aqi`;

            try {
                const [weatherData, aqiData] = await Promise.all([
                    fetchWithTimeout(weatherUrl),
                    fetchWithTimeout(aqiUrl).catch(() => null)
                ]);

                localStorage.setItem(cacheKey, JSON.stringify({ weatherData, aqiData, ts: Date.now() }));
                renderWeather(weatherData, aqiData, false);
            } catch (err) {
                console.warn('Weather fetch failed, attempting cache fallback:', err);
                const cachedRaw = localStorage.getItem(cacheKey);
                if (cachedRaw) {
                    try {
                        const cached = JSON.parse(cachedRaw);
                        renderWeather(cached.weatherData, cached.aqiData, true);
                        return;
                    } catch (_) {}
                }
                DOM.weatherDesc.textContent = 'Weather Unavailable';
                setBackgroundImage(CONFIG.BACKGROUNDS.FALLBACK);
            }
        }

        /* ==========================================================================
           HEBCAL SHABBAT & JEWISH HOLIDAY CALENDAR (With Offline Fallback)
           ========================================================================== */
        function generateLocalShabbatFallback() {
            const now = new Date();
            const events = [];
            // Find upcoming Friday & Saturday
            const dayOfWeek = now.getDay();
            const daysUntilFriday = (5 - dayOfWeek + 7) % 7;
            const friday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilFriday);
            const saturday = new Date(friday.getFullYear(), friday.getMonth(), friday.getDate() + 1);

            const fmtDate = new Intl.DateTimeFormat(CONFIG.LOCALE, { weekday: 'short', month: 'short', day: 'numeric' });
            events.push({ title: '🕯️ Candle Lighting', sub: `${fmtDate.format(friday)} · ~18m before sunset` });
            events.push({ title: '✨ Havdalah', sub: `${fmtDate.format(saturday)} · Nightfall` });
            return events;
        }

        function renderHebcalEvents(items) {
            if (!items || items.length === 0) {
                DOM.hebcalEventsList.innerHTML = `<div class="glass-panel rounded-xl px-3.5 py-2.5 text-white/70 shadow-lg">No upcoming events</div>`;
                return;
            }

            DOM.hebcalEventsList.innerHTML = items.slice(0, CONFIG.HEBCAL.MAX_ITEMS).map(ev => `
                <div class="glass-panel rounded-xl px-3.5 py-2.5 shadow-lg flex flex-col leading-tight">
                    <span class="font-semibold text-white">${ev.title}</span>
                    ${ev.sub ? `<span class="text-[11px] text-white/70 mt-0.5">${ev.sub}</span>` : ''}
                </div>
            `).join('');
        }

        async function fetchHebcalCalendar() {
            if (!CONFIG.HEBCAL.ENABLED) {
                DOM.hebcalCard.classList.add('hidden');
                return;
            }

            const cacheKey = `${CONFIG.STORAGE_KEY}_hebcal_v4`;
            const loc = CONFIG.LOCATION;
            const url = `https://www.hebcal.com/shabbat?cfg=json&geo=pos&latitude=${loc.LAT}&longitude=${loc.LON}&tzid=America/New_York&M=on&b=${CONFIG.HEBCAL.CANDLE_LIGHTING_MINS}&m=${CONFIG.HEBCAL.HAVDALAH_MINS}`;

            try {
                const data = await fetchWithTimeout(url);
                if (data && Array.isArray(data.items)) {
                    const fmtDay = new Intl.DateTimeFormat(CONFIG.LOCALE, { weekday: 'short', month: 'short', day: 'numeric' });
                    const parsed = data.items.map(item => {
                        const d = new Date(item.date);
                        const dayStr = !isNaN(d.getTime()) ? fmtDay.format(d) : '';
                        let icon = '📅';
                        if (item.category === 'candles') icon = '🕯️';
                        else if (item.category === 'havdalah') icon = '✨';
                        else if (item.category === 'parashat') icon = '📖';
                        else if (item.category === 'holiday') icon = '✡️';

                        return {
                            title: `${icon} ${item.title}`,
                            sub: dayStr
                        };
                    });

                    localStorage.setItem(cacheKey, JSON.stringify(parsed));
                    renderHebcalEvents(parsed);
                    return;
                }
            } catch (err) {
                console.warn('Hebcal fetch failed, using cache/fallback:', err);
            }

            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    renderHebcalEvents(JSON.parse(cached));
                    return;
                } catch (_) {}
            }

            renderHebcalEvents(generateLocalShabbatFallback());
        }

        /* ==========================================================================
           KITCHEN TIMERS & TONE.JS AMBIENT SOUNDSCAPES
           ========================================================================== */
        async function playTimerChime() {
            try {
                await Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.05, decay: 0.4, sustain: 0.2, release: 1.5 }
                }).toDestination();
                synth.volume.value = CONFIG.SOUND.CHIME_VOLUME_DB;

                const now = Tone.now();
                synth.triggerAttackRelease('C5', '8n', now);
                synth.triggerAttackRelease('E5', '8n', now + 0.2);
                synth.triggerAttackRelease('G5', '8n', now + 0.4);
                synth.triggerAttackRelease('C6', '2n', now + 0.6);
            } catch (e) {
                console.warn('Audio chime blocked:', e);
            }
        }

        function startTimer(minutes) {
            stopTimer();
            state.timerEndTime = Date.now() + minutes * 60 * 1000;
            DOM.timerBadge.classList.remove('hidden');
            DOM.btnCancelTimer.classList.remove('hidden');

            const tick = () => {
                const remainingMs = state.timerEndTime - Date.now();
                if (remainingMs <= 0) {
                    stopTimer();
                    playTimerChime();
                    return;
                }
                const totalSec = Math.ceil(remainingMs / 1000);
                const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
                const s = (totalSec % 60).toString().padStart(2, '0');
                DOM.timerDisplay.textContent = `${m}:${s}`;
            };

            tick();
            state.timerInterval = setInterval(tick, 500);
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            state.timerEndTime = null;
            DOM.timerBadge.classList.add('hidden');
            DOM.btnCancelTimer.classList.add('hidden');
        }

        async function cycleAmbientSound() {
            // 0 = Off, 1 = Brown Noise, 2 = Soft Rain (Pink Noise + Lowpass), 3 = White Noise
            state.ambientIndex = (state.ambientIndex + 1) % 4;

            if (state.ambientNode) {
                try {
                    state.ambientNode.stop();
                    state.ambientNode.dispose();
                } catch (_) {}
                state.ambientNode = null;
            }
            if (state.ambientGain) {
                try { state.ambientGain.dispose(); } catch (_) {}
                state.ambientGain = null;
            }

            const labels = ['🎧 Off', '🎧 Brown', '🌧️ Rain', '🎧 White'];
            DOM.btnAmbientSound.textContent = labels[state.ambientIndex];

            if (state.ambientIndex === 0) return;

            try {
                await Tone.start();
                const types = ['', 'brown', 'pink', 'white'];
                const noiseType = types[state.ambientIndex];

                const gain = new Tone.Gain(Tone.dbToGain(CONFIG.SOUND.VOLUME_DB)).toDestination();
                const noise = new Tone.Noise(noiseType);

                if (state.ambientIndex === 2) {
                    const filter = new Tone.Filter(650, 'lowpass').connect(gain);
                    noise.connect(filter);
                } else {
                    noise.connect(gain);
                }

                noise.start();
                state.ambientNode = noise;
                state.ambientGain = gain;
            } catch (err) {
                console.warn('Ambient audio failed:', err);
                state.ambientIndex = 0;
                DOM.btnAmbientSound.textContent = '🎧 Off';
            }
        }

        /* ==========================================================================
           HARDWARE PROTECTION (Pixel Shift, Wake Lock, Network Health)
           ========================================================================== */
        function initPixelShift() {
            if (!CONFIG.PIXEL_SHIFT.ENABLED) return;
            setInterval(() => {
                const max = CONFIG.PIXEL_SHIFT.MAX_OFFSET_PX;
                const dx = Math.floor(Math.random() * (max * 2 + 1)) - max;
                const dy = Math.floor(Math.random() * (max * 2 + 1)) - max;
                DOM.root.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
            }, CONFIG.PIXEL_SHIFT.INTERVAL_MS);
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    state.wakeLock = await navigator.wakeLock.request('screen');
                } catch (_) {}
            }
        }

        function initNetworkMonitor() {
            const updateOnlineStatus = () => {
                if (navigator.onLine) {
                    DOM.networkOfflinePill.classList.add('hidden');
                } else {
                    DOM.networkOfflinePill.classList.remove('hidden');
                }
            };
            window.addEventListener('online', () => {
                updateOnlineStatus();
                fetchWeatherAndEnv();
                fetchHebcalCalendar();
            });
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();
        }

        /* ==========================================================================
           ALWAYS-VISIBLE BOTTOM-LEFT CONTROL DOCK & BLACKOUT MODE
           ========================================================================== */
        function setBlackoutMode(active) {
            state.isBlackout = active;
            if (active) {
                DOM.blackoutOverlay.classList.remove('hidden');
            } else {
                DOM.blackoutOverlay.classList.add('hidden');
            }
        }

        function initControls() {
            // Wake from blackout on single tap
            DOM.blackoutOverlay.addEventListener('click', (e) => {
                e.stopPropagation();
                setBlackoutMode(false);
            });

            // Double-tap anywhere on main screen to toggle Blackout Sleep Mode
            document.body.addEventListener('dblclick', (e) => {
                if (e.target.closest('#control-dock') || state.isBlackout) return;
                setBlackoutMode(true);
            });

            // Quick Timer Buttons
            document.querySelectorAll('.timer-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const mins = parseInt(btn.getAttribute('data-timer'), 10);
                    startTimer(mins);
                });
            });

            DOM.btnCancelTimer.addEventListener('click', (e) => {
                e.stopPropagation();
                stopTimer();
            });

            // Ambient Soundscape Cycle
            DOM.btnAmbientSound.addEventListener('click', (e) => {
                e.stopPropagation();
                cycleAmbientSound();
            });

            // Cycle Wallpaper Manually
            DOM.btnCycleBg.addEventListener('click', (e) => {
                e.stopPropagation();
                const keys = Object.keys(CONFIG.BACKGROUNDS);
                state.manualBgIndex = (state.manualBgIndex + 1) % keys.length;
                setBackgroundImage(CONFIG.BACKGROUNDS[keys[state.manualBgIndex]]);
            });

            // Toggle Night Mode Override
            DOM.btnToggleNight.addEventListener('click', (e) => {
                e.stopPropagation();
                const currentlyNight = parseFloat(DOM.nightOverlay.style.opacity || '0') > 0.5;
                state.manualNightOverride = !currentlyNight;
                updateNightMode();
            });

            // Blackout Screen Button
            DOM.btnBlackout.addEventListener('click', (e) => {
                e.stopPropagation();
                setBlackoutMode(true);
            });

            // Force Refresh Weather & Calendar
            DOM.btnRefresh.addEventListener('click', (e) => {
                e.stopPropagation();
                state.manualBgIndex = -1;
                fetchWeatherAndEnv();
                fetchHebcalCalendar();
            });
        }

        /* ==========================================================================
           INITIALIZATION
           ========================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            setBackgroundImage(CONFIG.BACKGROUNDS.CLEAR_DAY);
            updateClock();
            setInterval(updateClock, CONFIG.CLOCK_INTERVAL_MS);

            fetchWeatherAndEnv();
            fetchHebcalCalendar();
            setInterval(() => {
                fetchWeatherAndEnv();
                fetchHebcalCalendar();
            }, CONFIG.WEATHER_INTERVAL_MS);

            initControls();
            initPixelShift();
            initNetworkMonitor();
            requestWakeLock();

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        });
    </script>
